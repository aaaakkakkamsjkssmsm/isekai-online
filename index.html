<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>異世界オンライン</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111827;
    font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
}

body{
    user-select:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

canvas{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    image-rendering:auto;
    background:#78b85e;
}


/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    top:15px;
    left:15px;

    padding:12px 16px;

    color:white;

    background:rgba(8,13,25,.88);

    border:2px solid #7687ae;
    border-radius:12px;

    box-shadow:0 5px 20px rgba(0,0,0,.35);

    line-height:1.6;

    pointer-events:none;
}

#hud .title{
    color:#ffd86b;
    font-weight:bold;
}


/* =========================
   操作説明
========================= */

#help{
    position:absolute;

    bottom:15px;
    right:15px;

    color:#fff;

    padding:9px 13px;

    background:rgba(5,10,20,.8);

    border:1px solid #69789d;
    border-radius:10px;

    font-size:13px;
}


/* =========================
   会話
========================= */

#dialog{
    position:absolute;

    left:50%;
    bottom:30px;

    transform:translateX(-50%);

    width:min(760px,calc(100% - 30px));

    padding:18px 22px;

    color:white;

    background:rgba(8,13,27,.96);

    border:2px solid #d7c277;

    border-radius:14px;

    box-shadow:0 8px 30px rgba(0,0,0,.7);

    display:none;
}

.dialogName{
    color:#ffd86b;
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}


/* =========================
   戦闘画面
========================= */

#battleScreen{
    position:absolute;

    inset:0;

    display:none;

    background:
        linear-gradient(
            rgba(30,50,80,.2),
            rgba(5,10,20,.5)
        ),
        linear-gradient(
            #74a8c4 0 48%,
            #6f9d56 48% 100%
        );
}


/* 空 */

.battleSky{
    position:absolute;
    inset:0 0 48% 0;

    background:
        radial-gradient(
            circle at 20% 25%,
            rgba(255,255,255,.8),
            transparent 8%
        ),
        radial-gradient(
            circle at 70% 20%,
            rgba(255,255,255,.7),
            transparent 7%
        ),
        #79afd0;
}


/* 地面 */

.battleGround{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:52%;

    background:
        radial-gradient(
            ellipse at center,
            #8bbf68,
            #578a4c
        );
}


/* 敵 */

.enemyArea{
    position:absolute;

    right:16%;
    top:20%;

    text-align:center;

    color:white;

    text-shadow:
        0 2px 4px #000;
}

.enemyEmoji{
    font-size:125px;

    filter:
        drop-shadow(
            0 12px 7px
            rgba(0,0,0,.3)
        );
}

.enemyName{
    font-size:25px;
    font-weight:bold;
}


/* プレイヤー */

.playerArea{
    position:absolute;

    left:16%;
    bottom:28%;

    text-align:center;

    color:white;

    text-shadow:
        0 2px 4px #000;
}

.playerBattleEmoji{
    font-size:100px;

    filter:
        drop-shadow(
            0 10px 7px
            rgba(0,0,0,.3)
        );
}


/* 敵HP */

.enemyHP{
    margin-top:8px;

    width:200px;
    height:17px;

    background:#202020;

    border:2px solid white;

    border-radius:20px;

    overflow:hidden;
}

.enemyHPFill{
    width:100%;
    height:100%;

    background:#e34e4e;

    transition:.3s;
}


/* =========================
   戦闘UI
========================= */

#battleUI{
    position:absolute;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    width:min(850px,calc(100% - 30px));

    background:rgba(8,13,28,.96);

    border:2px solid #c9b66d;

    border-radius:15px;

    padding:15px;

    color:white;

    box-shadow:0 8px 30px #000;
}

.battleStatus{
    display:flex;

    justify-content:space-between;

    gap:15px;

    flex-wrap:wrap;

    margin-bottom:12px;
}

.statusBox{
    flex:1;

    min-width:220px;

    padding:9px;

    background:#121d38;

    border-radius:8px;

    border:1px solid #45577f;
}

.hpBar{
    width:100%;
    height:13px;

    margin-top:5px;

    background:#222;

    border-radius:20px;

    overflow:hidden;
}

.hpFill{
    height:100%;

    width:100%;

    background:#49bd62;

    transition:.3s;
}

.battleLog{
    min-height:32px;

    margin-bottom:12px;

    color:#dfe7f7;
}

.commandGrid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}

.commandGrid button{
    padding:13px 8px;

    color:white;

    background:
        linear-gradient(
            #365a9e,
            #1d3569
        );

    border:1px solid #7895d0;

    border-radius:9px;

    cursor:pointer;

    font-weight:bold;

    transition:.15s;
}

.commandGrid button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 4px 15px
        rgba(80,130,255,.4);
}

.commandGrid button:disabled{
    opacity:.45;
    cursor:not-allowed;
}


/* =========================
   メニュー
========================= */

#menu{
    position:absolute;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.55);
}

.menuBox{
    width:min(480px,calc(100% - 30px));

    padding:24px;

    color:white;

    background:#101a31;

    border:2px solid #8798c2;

    border-radius:15px;

    box-shadow:0 15px 50px #000;
}

.menuBox h2{
    color:#ffe08a;
    margin-top:0;
}

.menuRow{
    display:flex;

    justify-content:space-between;

    padding:11px 0;

    border-bottom:
        1px solid #36425e;
}

.menuBox button{
    margin-top:18px;

    padding:10px 18px;

    background:#3156a3;

    border:0;

    color:white;

    border-radius:8px;

    cursor:pointer;
}


/* =========================
   スマホ
========================= */

@media(max-width:700px){

    #hud{
        font-size:12px;
        padding:8px 10px;
    }

    #help{
        font-size:11px;
        padding:7px;
    }

    .enemyEmoji{
        font-size:90px;
    }

    .playerBattleEmoji{
        font-size:75px;
    }

    .enemyArea{
        right:8%;
    }

    .playerArea{
        left:8%;
    }

    .commandGrid{
        grid-template-columns:
            repeat(2,1fr);
    }

    #battleUI{
        bottom:8px;
        padding:10px;
    }
}
</style>
</head>


<body>

<div id="game">

<canvas
    id="world"
    width="1152"
    height="648">
</canvas>


<!-- =========================
     HUD
========================= -->

<div id="hud">

<div class="title">
異世界オンライン
</div>

<div id="playerHud">
読み込み中...
</div>

</div>


<div id="help">
移動：矢印キー / WASD　
｜ E：話す　
｜ M：メニュー
</div>


<!-- =========================
     会話
========================= -->

<div id="dialog">

<div
    id="dialogName"
    class="dialogName">
</div>

<div id="dialogText"></div>

</div>


<!-- =========================
     メニュー
========================= -->

<div id="menu">

<div class="menuBox">

<h2>📖 冒険者メニュー</h2>

<div class="menuRow">
<span>名前</span>
<b id="menuName"></b>
</div>

<div class="menuRow">
<span>種族</span>
<b id="menuRace"></b>
</div>

<div class="menuRow">
<span>職業</span>
<b id="menuJob"></b>
</div>

<div class="menuRow">
<span>レベル</span>
<b id="menuLevel"></b>
</div>

<div class="menuRow">
<span>HP</span>
<b id="menuHP"></b>
</div>

<div class="menuRow">
<span>STR</span>
<b id="menuSTR"></b>
</div>

<div class="menuRow">
<span>DEF</span>
<b id="menuDEF"></b>
</div>

<div class="menuRow">
<span>INT</span>
<b id="menuINT"></b>
</div>

<div class="menuRow">
<span>AGI</span>
<b id="menuAGI"></b>
</div>

<button onclick="toggleMenu()">
閉じる
</button>

</div>

</div>


<!-- =========================
     戦闘画面
========================= -->

<div id="battleScreen">

<div class="battleSky"></div>

<div class="battleGround"></div>


<!-- 敵 -->

<div class="enemyArea">

<div
    id="enemyEmoji"
    class="enemyEmoji">
🟢
</div>

<div
    id="enemyName"
    class="enemyName">
スライム
</div>

<div class="enemyHP">

<div
    id="enemyHPFill"
    class="enemyHPFill">
</div>

</div>

</div>


<!-- プレイヤー -->

<div class="playerArea">

<div class="playerBattleEmoji">
🧙
</div>

<div id="battlePlayerName">
</div>

</div>


<!-- 戦闘UI -->

<div id="battleUI">

<div class="battleStatus">

<div class="statusBox">

<b id="battlePlayerStatus">
</b>

<div class="hpBar">

<div
    id="battlePlayerHP"
    class="hpFill">
</div>

</div>

</div>


<div class="statusBox">

<b id="battleEnemyStatus">
</b>

</div>

</div>


<div
    id="battleLog"
    class="battleLog">
</div>


<div class="commandGrid">

<button onclick="playerAttack()">
⚔️ こうげき
</button>

<button onclick="playerSkill()">
✨ スキル
</button>

<button onclick="useItem()">
🎒 どうぐ
</button>

<button onclick="runAway()">
🏃 にげる
</button>

</div>

</div>

</div>

</div>


<script>

/* ==================================================
   基本設定
================================================== */

const canvas =
document.getElementById("world");

const ctx =
canvas.getContext("2d");

const WIDTH=1152;
const HEIGHT=648;

const TILE=48;

const MAP_WIDTH=24;
const MAP_HEIGHT=16;


/* ==================================================
   プレイヤー
================================================== */

let player={

    x:11.5*TILE,

    y:10.5*TILE,

    width:26,

    height:32,

    speed:190,

    name:"木村",

    race:"オーク",

    job:"二刀流見習い",

    level:1,

    hp:55,

    maxHp:55,

    str:40,

    def:30,

    int:10,

    mnd:15,

    agi:25,

    luk:20,

    skillPoints:0

};


/* ==================================================
   キー
================================================== */

const keys={};

window.addEventListener(
"keydown",
e=>{

    const key=
        e.key.toLowerCase();

    keys[key]=true;


    if(
        [
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright",
            " "
        ].includes(key)
    ){

        e.preventDefault();

    }


    if(
        key==="e" &&
        !e.repeat
    ){

        talk();

    }


    if(
        key==="m" &&
        !e.repeat
    ){

        toggleMenu();

    }

});


window.addEventListener(
"keyup",
e=>{

    keys[e.key.toLowerCase()]=false;

});


/* ==================================================
   マップ
================================================== */

const map=[

"########################",

"#gggggggggggggggggggggg#",

"#gggggggggggggggggggggg#",

"#gggggggggggggggggggggg#",

"#gggwwggggggggggwwggggg#",

"#gggwwggg#####ggwwggggg#",

"#gggwwggg#...#ggwwggggg#",

"#gggggggg#...#ggggggggg#",

"#gggggggg#...#ggggggggg#",

"#gggggggg#...#ggggggggg#",

"#gggggggg#...#ggggggggg#",

"#gggggggg#...#ggggggggg#",

"#gggggggg#####ggggggggg#",

"#gggggggggggggggggggggg#",

"#gggggggggggggggggggggg#",

"########################"

];


function getTile(
    pixelX,
    pixelY
){

    const tx=
        Math.floor(
            pixelX/TILE
        );

    const ty=
        Math.floor(
            pixelY/TILE
        );

    if(
        tx<0 ||
        ty<0 ||
        tx>=MAP_WIDTH ||
        ty>=MAP_HEIGHT
    ){

        return "#";

    }

    return map[ty][tx];

}


function blocked(
    pixelX,
    pixelY
){

    const tile=
        getTile(
            pixelX,
            pixelY
        );

    return (
        tile==="#" ||
        tile==="w"
    );

}


function canMove(
    x,
    y
){

    const hw=
        player.width/2;

    const hh=
        player.height/2;


    return !(
        blocked(
            x-hw,
            y-hh
        ) ||

        blocked(
            x+hw,
            y-hh
        ) ||

        blocked(
            x-hw,
            y+hh
        ) ||

        blocked(
            x+hw,
            y+hh
        )
    );

}


/* ==================================================
   NPC
================================================== */

const npcs=[

{

    x:7.5,

    y:7.2,

    name:"村長",

    text:
    "ようこそ、冒険者よ。ここが君の冒険の始まりだ。"

},

{

    x:15.5,

    y:7.0,

    name:"道具屋",

    text:
    "薬草やポーションは冒険の必需品だぞ。"

},

{

    x:18.5,

    y:11.2,

    name:"旅人",

    text:
    "この世界はとても広い。海の向こうにも大陸があるらしい。"

},

{

    x:5.5,

    y:12.2,

    name:"訓練兵",

    text:
    "街の外には魔物がいる。準備してから向かうんだぞ。"

}

];


/* ==================================================
   描画
================================================== */

function drawMap(
    cameraX,
    cameraY
){

    for(
        let y=0;
        y<MAP_HEIGHT;
        y++
    ){

        for(
            let x=0;
            x<MAP_WIDTH;
            x++
        ){

            const tile=
                map[y][x];

            const sx=
                x*TILE-cameraX;

            const sy=
                y*TILE-cameraY;


            /* 草 */

            if(tile==="g"){

                ctx.fillStyle=
                    ((x+y)%2)
                    ? "#70b45d"
                    : "#79bd64";

                ctx.fillRect(
                    sx,
                    sy,
                    TILE,
                    TILE
                );


                if(
                    (x*13+y*7)%17===0
                ){

                    ctx.fillStyle=
                        "#4f984c";

                    ctx.fillRect(
                        sx+12,
                        sy+10,
                        4,
                        12
                    );

                    ctx.fillRect(
                        sx+8,
                        sy+16,
                        12,
                        4
                    );

                }

            }


            /* 壁 */

            else if(tile==="#"){

                ctx.fillStyle=
                    "#4d5b4a";

                ctx.fillRect(
                    sx,
                    sy,
                    TILE,
                    TILE
                );

                ctx.fillStyle=
                    "#697765";

                ctx.fillRect(
                    sx+3,
                    sy+3,
                    TILE-6,
                    12
                );

                ctx.fillStyle=
                    "#374137";

                ctx.fillRect(
                    sx,
                    sy+TILE-7,
                    TILE,
                    7
                );

            }


            /* 水 */

            else if(tile==="w"){

                ctx.fillStyle=
                    "#4d9ec7";

                ctx.fillRect(
                    sx,
                    sy,
                    TILE,
                    TILE
                );

                ctx.strokeStyle=
                    "rgba(255,255,255,.35)";

                ctx.lineWidth=2;


                for(
                    let k=8;
                    k<45;
                    k+=17
                ){

                    ctx.beginPath();

                    ctx.moveTo(
                        sx+k,
                        sy+15
                    );

                    ctx.quadraticCurveTo(
                        sx+k+7,
                        sy+8,
                        sx+k+14,
                        sy+15
                    );

                    ctx.stroke();

                }

            }


            /* 道 */

            else{

                ctx.fillStyle=
                    "#c4aa76";

                ctx.fillRect(
                    sx,
                    sy,
                    TILE,
                    TILE
                );

                ctx.fillStyle=
                    "#d0ba8b";

                ctx.fillRect(
                    sx+2,
                    sy+2,
                    TILE-4,
                    TILE-4
                );

            }

        }

    }


    drawBuilding(
        9,
        5,
        3,
        2,
        "宿屋",
        "#9d4f47",
        cameraX,
        cameraY
    );


    drawBuilding(
        14,
        5,
        3,
        2,
        "道具屋",
        "#4b6ea8",
        cameraX,
        cameraY
    );


    drawBuilding(
        9,
        11,
        4,
        2,
        "冒険者ギルド",
        "#7255a0",
        cameraX,
        cameraY
    );

}


function drawBuilding(
    tileX,
    tileY,
    tileWidth,
    tileHeight,
    name,
    color,
    cameraX,
    cameraY
){

    const x=
        tileX*TILE-cameraX;

    const y=
        tileY*TILE-cameraY;

    const width=
        tileWidth*TILE;

    const height=
        tileHeight*TILE;


    ctx.fillStyle="#593a2b";

    ctx.fillRect(
        x-3,
        y+20,
        width+6,
        height-20
    );


    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.moveTo(
        x-8,
        y+25
    );

    ctx.lineTo(
        x+width/2,
        y-8
    );

    ctx.lineTo(
        x+width+8,
        y+25
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle="#e9d7a7";

    ctx.fillRect(
        x+width/2-15,
        y+height-44,
        30,
        44
    );


    ctx.fillStyle="#fff0b5";

    ctx.font=
        "bold 15px sans-serif";

    ctx.textAlign="center";

    ctx.fillText(
        name,
        x+width/2,
        y+18
    );

}


/* ==================================================
   キャラクター
================================================== */

function drawCharacter(
    character,
    color,
    cameraX,
    cameraY
){

    const x=
        character.x-cameraX;

    const y=
        character.y-cameraY;


    /* 影 */

    ctx.fillStyle=
        "rgba(0,0,0,.25)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        y+18,
        18,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* 体 */

    ctx.fillStyle=color;

    ctx.fillRect(
        x-12,
        y-2,
        24,
        25
    );


    /* 顔 */

    ctx.fillStyle="#edc39b";

    ctx.beginPath();

    ctx.arc(
        x,
        y-13,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* 髪 */

    ctx.fillStyle="#29201d";

    ctx.fillRect(
        x-11,
        y-24,
        22,
        8
    );

}


/* ==================================================
   プレイヤー
================================================== */

function drawPlayer(
    cameraX,
    cameraY
){

    drawCharacter(
        player,
        "#dcae35",
        cameraX,
        cameraY
    );


    ctx.fillStyle="#fff";

    ctx.font=
        "bold 13px sans-serif";

    ctx.textAlign="center";


    ctx.fillText(
        player.name,
        player.x-cameraX,
        player.y-cameraY-31
    );

}


/* ==================================================
   HUD
================================================== */

function updateHUD(){

    document.getElementById(
        "playerHud"
    ).innerHTML=`

        <b>${player.name}</b>
       　Lv.${player.level}<br>

        ${player.race}
         /
        ${player.job}<br>

        ❤️ HP
        ${player.hp}
        /
        ${player.maxHp}

    `;

}


/* ==================================================
   NPCとの距離
================================================== */

function nearestNPC(){

    let nearest=null;

    let distance=80;


    for(
        const npc of npcs
    ){

        const d=
            Math.hypot(
                player.x-npc.x*TILE,
                player.y-npc.y*TILE
            );


        if(d<distance){

            distance=d;

            nearest=npc;

        }

    }


    return nearest;

}


/* ==================================================
   会話
================================================== */

function talk(){

    const npc=
        nearestNPC();


    if(!npc){

        showDialog(
            "",
            "近くに話しかけられる人はいない。"
        );

        return;

    }


    showDialog(
        npc.name,
        npc.text
    );

}


function showDialog(
    name,
    text
){

    document.getElementById(
        "dialogName"
    ).textContent=name;


    document.getElementById(
        "dialogText"
    ).textContent=text;


    document.getElementById(
        "dialog"
    ).style.display="block";


    clearTimeout(
        window.dialogTimeout
    );


    window.dialogTimeout=
        setTimeout(
            ()=>{
                document.getElementById(
                    "dialog"
                ).style.display="none";
            },
            4500
        );

}


/* ==================================================
   メニュー
================================================== */

function toggleMenu(){

    const menu=
        document.getElementById(
            "menu"
        );


    if(
        menu.style.display==="flex"
    ){

        menu.style.display="none";

        return;

    }


    document.getElementById(
        "menuName"
    ).textContent=
        player.name;


    document.getElementById(
        "menuRace"
    ).textContent=
        player.race;


    document.getElementById(
        "menuJob"
    ).textContent=
        player.job;


    document.getElementById(
        "menuLevel"
    ).textContent=
        player.level;


    document.getElementById(
        "menuHP"
    ).textContent=
        `${player.hp} / ${player.maxHp}`;


    document.getElementById(
        "menuSTR"
    ).textContent=
        player.str;


    document.getElementById(
        "menuDEF"
    ).textContent=
        player.def;


    document.getElementById(
        "menuINT"
    ).textContent=
        player.int;


    document.getElementById(
        "menuAGI"
    ).textContent=
        player.agi;


    menu.style.display="flex";

}


/* ==================================================
   敵データ
================================================== */

const monsters={

    slime:{

        name:"スライム",

        emoji:"🟢",

        maxHp:45,

        hp:45,

        attack:8,

        defense:2,

        exp:15,

        gold:8

    },


    goblin:{

        name:"ゴブリン",

        emoji:"👺",

        maxHp:65,

        hp:65,

        attack:12,

        defense:5,

        exp:25,

        gold:15

    },


    wolf:{

        name:"ウルフ",

        emoji:"🐺",

        maxHp:80,

        hp:80,

        attack:16,

        defense:7,

        exp:32,

        gold:20

    }

};


/* ==================================================
   戦闘状態
================================================== */

let battle=null;


/* ==================================================
   戦闘開始
================================================== */

function startBattle(){

    const names=
        Object.keys(
            monsters
        );


    const random=
        names[
            Math.floor(
                Math.random()*
                names.length
            )
        ];


    const original=
        monsters[random];


    battle={

        enemy:{

            name:original.name,

            emoji:original.emoji,

            maxHp:original.maxHp,

            hp:original.maxHp,

            attack:original.attack,

            defense:original.defense,

            exp:original.exp,

            gold:original.gold

        },

        active:true

    };


    document.getElementById(
        "battleScreen"
    ).style.display="block";


    document.getElementById(
        "enemyEmoji"
    ).textContent=
        battle.enemy.emoji;


    document.getElementById(
        "enemyName"
    ).textContent=
        battle.enemy.name;


    document.getElementById(
        "battlePlayerName"
    ).textContent=
        player.name;


    battleMessage(
        `${battle.enemy.name}が現れた！`
    );


    updateBattleUI();

}


/* ==================================================
   戦闘UI
================================================== */

function updateBattleUI(){

    if(!battle)return;


    const enemyPercent=
        Math.max(
            0,
            battle.enemy.hp/
            battle.enemy.maxHp*
            100
        );


    const playerPercent=
        Math.max(
            0,
            player.hp/
            player.maxHp*
            100
        );


    document.getElementById(
        "enemyHPFill"
    ).style.width=
        enemyPercent+"%";


    document.getElementById(
        "battlePlayerHP"
    ).style.width=
        playerPercent+"%";


    document.getElementById(
        "battlePlayerStatus"
    ).textContent=
        `${player.name}　HP ${player.hp}/${player.maxHp}`;


    document.getElementById(
        "battleEnemyStatus"
    ).textContent=
        `${battle.enemy.name}　HP ${battle.enemy.hp}/${battle.enemy.maxHp}`;

}


/* ==================================================
   戦闘メッセージ
================================================== */

function battleMessage(
    message
){

    document.getElementById(
        "battleLog"
    ).textContent=
        message;

}


/* ==================================================
   攻撃
================================================== */

function playerAttack(){

    if(!battle)return;


    const damage=
        Math.max(
            1,
            player.str-
            battle.enemy.defense+
            Math.floor(
                Math.random()*8
            )
        );


    battle.enemy.hp=
        Math.max(
            0,
            battle.enemy.hp-
            damage
        );


    battleMessage(
        `${player.name}の攻撃！ ${damage}ダメージ！`
    );


    updateBattleUI();


    if(
        battle.enemy.hp<=0
    ){

        winBattle();

        return;

    }


    setTimeout(
        enemyTurn,
        700
    );

}


/* ==================================================
   スキル
================================================== */

function playerSkill(){

    if(!battle)return;


    const damage=
        Math.max(
            1,
            Math.floor(
                player.str*1.5
            )-
            battle.enemy.defense
        );


    battle.enemy.hp=
        Math.max(
            0,
            battle.enemy.hp-
            damage
        );


    battleMessage(
        `⚡ 二刀流の一撃！ ${damage}ダメージ！`
    );


    updateBattleUI();


    if(
        battle.enemy.hp<=0
    ){

        winBattle();

        return;

    }


    setTimeout(
        enemyTurn,
        700
    );

}


/* ==================================================
   道具
================================================== */

function useItem(){

    if(!battle)return;


    const heal=25;


    player.hp=
        Math.min(
            player.maxHp,
            player.hp+heal
        );


    battleMessage(
        `🧪 ポーションを使った！ HPが${heal}回復！`
    );


    updateBattleUI();


    setTimeout(
        enemyTurn,
        700
    );

}


/* ==================================================
   敵ターン
================================================== */

function enemyTurn(){

    if(
        !battle ||
        !battle.active
    ){

        return;

    }


    const damage=
        Math.max(
            1,
            battle.enemy.attack-
            Math.floor(
                player.def/4
            )+
            Math.floor(
                Math.random()*5
            )
        );


    player.hp=
        Math.max(
            0,
            player.hp-damage
        );


    battleMessage(
        `${battle.enemy.name}の攻撃！ ${damage}ダメージ！`
    );


    updateBattleUI();

    updateHUD();


    if(
        player.hp<=0
    ){

        loseBattle();

    }

}


/* ==================================================
   勝利
================================================== */

function winBattle(){

    battle.active=false;


    player.gold=
        (player.gold||0)+
        battle.enemy.gold;


    player.exp=
        (player.exp||0)+
        battle.enemy.exp;


    battleMessage(
        `${battle.enemy.name}を倒した！`
    );


    setTimeout(
        ()=>{

            showDialog(
                "戦闘終了",
                `${battle.enemy.name}を倒した！ EXP ${battle.enemy.exp}、${battle.enemy.gold}Gを獲得！`
            );


            checkLevelUp();


            closeBattle();

        },
        1000
    );

}


/* ==================================================
   レベルアップ
================================================== */

function checkLevelUp(){

    const needed=
        player.level*20;


    if(
        player.exp>=needed
    ){

        player.exp-=needed;

        player.level++;

        player.maxHp+=10;

        player.hp=
            player.maxHp;

        player.str+=3;

        player.def+=2;

        player.int+=2;

        player.mnd+=2;

        player.agi+=2;

        player.skillPoints+=2;


        showDialog(
            "LEVEL UP!",
            `レベル${player.level}になった！ スキルポイントを2獲得！`
        );

    }


    updateHUD();

}


/* ==================================================
   敗北
================================================== */

function loseBattle(){

    battle.active=false;


    player.hp=
        player.maxHp;


    battleMessage(
        "力尽きてしまった……"
    );


    setTimeout(
        ()=>{

            closeBattle();


            showDialog(
                "敗北",
                "気がつくと始まりの街に戻っていた。"
            );

        },
        1200
    );

}


/* ==================================================
   逃げる
================================================== */

function runAway(){

    if(!battle)return;


    if(
        Math.random()<0.75
    ){

        battleMessage(
            "うまく逃げ切った！"
        );


        setTimeout(
            closeBattle,
            500
        );

    }else{

        battleMessage(
            "逃げられない！"
        );


        setTimeout(
            enemyTurn,
            700
        );

    }

}


/* ==================================================
   戦闘終了
================================================== */

function closeBattle(){

    battle=null;


    document.getElementById(
        "battleScreen"
    ).style.display="none";


    updateHUD();

}


/* ==================================================
   移動
================================================== */

function movePlayer(
    delta
){

    if(
        battle
    ){

        return;

    }


    let dx=0;
    let dy=0;


    if(
        keys["arrowleft"] ||
        keys["a"]
    ){

        dx--;

    }


    if(
        keys["arrowright"] ||
        keys["d"]
    ){

        dx++;

    }


    if(
        keys["arrowup"] ||
        keys["w"]
    ){

        dy--;

    }


    if(
        keys["arrowdown"] ||
        keys["s"]
    ){

        dy++;

    }


    if(
        dx===0 &&
        dy===0
    ){

        return;

    }


    const length=
        Math.hypot(
            dx,
            dy
        );


    dx/=length;
    dy/=length;


    const move=
        player.speed*
        delta;


    const nextX=
        player.x+
        dx*move;


    const nextY=
        player.y+
        dy*move;


    if(
        canMove(
            nextX,
            player.y
        )
    ){

        player.x=
            nextX;

    }


    if(
        canMove(
            player.x,
            nextY
        )
    ){

        player.y=
            nextY;

    }

}


/* ==================================================
   マップ上でランダムエンカウント
================================================== */

let encounterTimer=0;


function randomEncounter(
    delta
){

    if(battle)return;


    encounterTimer+=delta;


    if(
        encounterTimer<2
    ){

        return;

    }


    encounterTimer=0;


    const tile=
        getTile(
            player.x,
            player.y
        );


    if(
        tile!=="g"
    ){

        return;

    }


    if(
        Math.random()<0.015
    ){

        startBattle();

    }

}


/* ==================================================
   カメラ
================================================== */

function draw(){

    const cameraX=
        Math.max(
            0,
            Math.min(
                MAP_WIDTH*TILE-WIDTH,
                player.x-WIDTH/2
            )
        );


    const cameraY=
        Math.max(
            0,
            Math.min(
                MAP_HEIGHT*TILE-HEIGHT,
                player.y-HEIGHT/2
            )
        );


    drawMap(
        cameraX,
        cameraY
    );


    npcs.forEach(
        (npc,index)=>{

            drawCharacter(
                {
                    x:npc.x*TILE,
                    y:npc.y*TILE
                },
                [
                    "#c76b55",
                    "#4f79bd",
                    "#ad65b0",
                    "#6b9a59"
                ][index],
                cameraX,
                cameraY
            );

        }
    );


    drawPlayer(
        cameraX,
        cameraY
    );

}


/* ==================================================
   ゲームループ
================================================== */

let lastTime=0;


function gameLoop(
    time
){

    const delta=
        Math.min(
            (time-lastTime)/1000,
            .05
        );


    lastTime=time;


    movePlayer(
        delta
    );


    randomEncounter(
        delta
    );


    draw();

    updateHUD();


    requestAnimationFrame(
        gameLoop
    );

}


updateHUD();

requestAnimationFrame(
    gameLoop
);

</script>
