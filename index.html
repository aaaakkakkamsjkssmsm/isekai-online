<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>異世界オンライン 3D</title>

<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#000;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif
}
button{font-family:inherit;cursor:pointer}

#home{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  color:white;overflow:hidden;
  background:
    radial-gradient(circle at 50% 30%,rgba(70,130,255,.35),transparent 38%),
    linear-gradient(#071326,#02040a)
}
#home:before{
  content:"";position:absolute;inset:0;opacity:.6;
  background:
    radial-gradient(circle at 15% 20%,white 0 1px,transparent 2px),
    radial-gradient(circle at 75% 15%,white 0 1px,transparent 2px),
    radial-gradient(circle at 45% 70%,white 0 1px,transparent 2px),
    radial-gradient(circle at 90% 80%,white 0 1px,transparent 2px);
  background-size:170px 150px,220px 180px,190px 160px,250px 200px
}
.homeBox{position:relative;width:min(600px,92vw);text-align:center}
.title{
  font-size:clamp(42px,9vw,78px);font-weight:900;letter-spacing:5px;
  text-shadow:0 0 12px #78b9ff,0 0 35px #315bff,4px 5px 0 #111
}
.subtitle{color:#b9d7ff;letter-spacing:8px;margin:8px 0 35px}
.homeButton{
  display:block;width:min(430px,100%);margin:12px auto;padding:16px;
  border:2px solid #66809d;border-radius:10px;
  background:linear-gradient(#243e69,#10213c);
  color:#fff;font-size:20px;font-weight:bold
}
.homeButton.main{
  font-size:25px;border-color:#9ed0ff;
  background:linear-gradient(#3978c7,#183967)
}
.version{margin-top:25px;color:#71819b;font-size:12px}

#creation{
  position:fixed;inset:0;z-index:900;display:none;
  color:white;background:#060a12;overflow:auto;padding:25px
}
.createBox{width:min(1050px,100%);margin:auto;padding-bottom:30px}
.createTitle{text-align:center;font-size:34px;margin:5px 0 25px}
.section{
  margin:18px 0;padding:18px;border:1px solid #45617f;
  border-radius:12px;background:rgba(8,18,32,.9)
}
.section h2{margin:0 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.selectCard{
  padding:14px 10px;border:2px solid #35475d;border-radius:10px;
  background:#101b2b;color:white;text-align:left
}
.selectCard.selected{
  border-color:#ffe27a;background:#263c5c;
  box-shadow:0 0 14px rgba(255,220,100,.25)
}
.cardName{font-weight:bold;font-size:17px}
.cardDesc{color:#9eb1c9;font-size:12px;margin-top:5px;line-height:1.5}
.stat{margin-top:6px;font-size:11px;color:#d8e7ff}
.nameInput{
  width:100%;max-width:500px;padding:13px;border-radius:8px;
  border:1px solid #536b87;background:#0b1320;color:white;font-size:18px
}
.startGame{
  display:block;width:min(450px,100%);margin:25px auto 5px;
  padding:17px;border:2px solid #ffd968;border-radius:10px;
  background:linear-gradient(#80651e,#4c3b10);color:#fff;
  font-size:22px;font-weight:bold
}

#game{position:fixed;inset:0;display:none}
canvas{display:block}

#hud{
  position:fixed;left:15px;top:15px;z-index:20;color:white;
  min-width:255px;padding:12px;border-radius:10px;
  background:rgba(5,10,18,.8);border:1px solid #ffffff44
}
#playerName{font-size:19px;font-weight:bold}
.small{font-size:12px;color:#b9c7d8}
.bar{width:225px;height:10px;background:#202936;border-radius:8px;overflow:hidden;margin-top:5px}
.barFill{height:100%;width:100%}
.hpFill{background:#e74c3c}
.mpFill{background:#3498db}
.expFill{background:#f1c40f}

#message{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  z-index:30;padding:9px 18px;color:white;
  background:rgba(0,0,0,.72);border-radius:8px;pointer-events:none
}

#menu{
  display:none;position:fixed;right:18px;top:18px;z-index:100;
  width:min(420px,92vw);max-height:85vh;overflow:auto;color:white;
  background:rgba(8,13,22,.96);border:1px solid #6985a5;
  border-radius:12px;padding:18px
}
.menuButton{
  width:100%;margin:5px 0;padding:11px;color:white;
  background:#17263a;border:1px solid #47627f;border-radius:7px
}
.skill{
  padding:10px;margin:7px 0;border:1px solid #3e536c;
  border-radius:7px;background:#101b2a
}
.skill button{
  float:right;color:white;background:#315e91;border:0;
  padding:6px 10px;border-radius:5px
}
.skill.learned{border-color:#e5c65b}

#touchUI{display:none;position:fixed;inset:0;z-index:50;pointer-events:none}
#joystick{
  position:absolute;left:22px;bottom:25px;width:125px;height:125px;
  border-radius:50%;background:#ffffff1f;border:2px solid #ffffff55;
  pointer-events:auto
}
#knob{
  position:absolute;width:52px;height:52px;left:35px;top:35px;
  border-radius:50%;background:#ffffff70
}
#cameraArea{
  position:absolute;left:25%;right:0;top:0;bottom:30%;pointer-events:auto
}
#actions{
  position:absolute;right:18px;bottom:18px;display:grid;
  grid-template-columns:repeat(2,75px);gap:10px;pointer-events:auto
}
.touchButton{
  width:75px;height:58px;border-radius:50%;
  border:1px solid #fff8;color:white;background:#0f1e32cc;font-weight:bold
}
@media(pointer:coarse){#touchUI{display:block}}

#battleUI{
  display:none;position:fixed;inset:0;z-index:200;
  background:linear-gradient(#111b2c,#070b12);color:white
}
#battleTop{text-align:center;padding:20px}
#enemyName{font-size:28px;font-weight:bold}
.enemyBar{
  width:min(500px,80vw);height:18px;background:#222;
  margin:10px auto;border-radius:10px;overflow:hidden
}
#enemyHP{width:100%;height:100%;background:#e74c3c}
#enemyStatus{text-align:center}
#battleLog{
  width:min(700px,90vw);height:180px;overflow:auto;
  margin:20px auto;padding:12px;background:#05080d;
  border:1px solid #42536b;border-radius:8px
}
#battleCommands{
  width:min(700px,90vw);margin:auto;
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px
}
.battleButton{
  padding:18px;font-size:18px;border-radius:8px;
  border:1px solid #6e819a;background:#18283d;color:white
}
</style>
</head>

<body>

<!-- ================= HOME ================= -->

<div id="home">
  <div class="homeBox">
    <div class="title">異世界オンライン</div>
    <div class="subtitle">ISEKAI ONLINE</div>

    <button class="homeButton main" onclick="openCreation()">▶ はじめる</button>
    <button class="homeButton" onclick="showJobBook()">📖 職業・種族図鑑</button>
    <button class="homeButton" onclick="showSettings()">⚙ 設定</button>

    <div class="version">EARLY ACCESS PROTOTYPE</div>
  </div>
</div>

<!-- ================= CHARACTER CREATION ================= -->

<div id="creation">
  <div class="createBox">

    <div class="createTitle">キャラクターを作成</div>

    <div class="section">
      <h2>名前</h2>
      <input id="nameInput" class="nameInput"
             maxlength="12" value="冒険者"
             placeholder="名前を入力">
    </div>

    <div class="section">
      <h2>種族を選択</h2>
      <div id="raceCards" class="cards"></div>
    </div>

    <div class="section">
      <h2>最初の職業を選択</h2>
      <div id="jobCards" class="cards"></div>
    </div>

    <button class="startGame" onclick="startGame()">
      ⚔ このキャラクターで冒険を始める
    </button>

    <button class="homeButton" onclick="backHome()">← ホームへ戻る</button>
  </div>
</div>

<!-- ================= GAME ================= -->

<div id="game">

  <div id="hud">
    <div id="playerName">冒険者</div>
    <div class="small" id="playerInfo">人間 / 見習い騎士</div>

    <div class="small">HP</div>
    <div class="bar"><div id="hpBar" class="barFill hpFill"></div></div>

    <div class="small">MP</div>
    <div class="bar"><div id="mpBar" class="barFill mpFill"></div></div>

    <div class="small">EXP</div>
    <div class="bar"><div id="expBar" class="barFill expFill"></div></div>

    <div class="small" id="levelInfo">Lv.1　SP 0　G 100</div>
  </div>

  <div id="message">広大な街を探索しよう。</div>

  <div id="menu">
    <h2>メニュー</h2>
    <div id="menuStatus"></div>
    <hr>
    <h3>スキルツリー</h3>
    <div id="skillList"></div>
    <button class="menuButton" onclick="closeMenu()">閉じる</button>
  </div>

  <!-- BATTLE -->

  <div id="battleUI">
    <div id="battleTop">
      <div id="enemyName">スライム</div>
      <div class="enemyBar"><div id="enemyHP"></div></div>
      <div id="enemyStatus">HP 30 / 30</div>
    </div>

    <div id="battleLog"></div>

    <div id="battleCommands">
      <button class="battleButton" onclick="battleAttack()">⚔ こうげき</button>
      <button class="battleButton" onclick="battleSkill()">✨ スキル</button>
      <button class="battleButton" onclick="battleGuard()">🛡 ぼうぎょ</button>
      <button class="battleButton" onclick="battleEscape()">🏃 にげる</button>
    </div>
  </div>

  <!-- TOUCH -->

  <div id="touchUI">

    <div id="joystick">
      <div id="knob"></div>
    </div>

    <div id="cameraArea"></div>

    <div id="actions">
      <button class="touchButton" onclick="attackNearest()">⚔<br>攻撃</button>
      <button class="touchButton" onclick="openMenu()">☰<br>MENU</button>
      <button class="touchButton" onclick="jump()">↑<br>ジャンプ</button>
      <button class="touchButton" onclick="dash()">⚡<br>ダッシュ</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>

/* =========================================================
   DATA
========================================================= */

const races=[
 {name:"人間",desc:"バランス型。自由度が高い。",bonus:"全能力"},
 {name:"エルフ",desc:"森に住む魔法種族。",bonus:"INT・MND"},
 {name:"ドワーフ",desc:"頑丈な職人種族。",bonus:"DEF・HP"},
 {name:"獣人",desc:"高い身体能力を持つ。",bonus:"STR・AGI"},
 {name:"小人",desc:"小柄で素早い。",bonus:"AGI"},
 {name:"妖精",desc:"魔法との相性が良い。",bonus:"INT"},
 {name:"鳥人",desc:"空を飛ぶ能力を持つ。",bonus:"AGI"},
 {name:"魚人",desc:"水中に強い。",bonus:"水適性"},
 {name:"リザードマン",desc:"硬い鱗を持つ。",bonus:"DEF"},
 {name:"ゴブリン",desc:"成長が少し早い。",bonus:"成長"},
 {name:"オーク",desc:"高い体力を持つ。",bonus:"HP"},
 {name:"魔族",desc:"闇属性に強い。",bonus:"闇魔法"},
 {name:"天使",desc:"光属性に強い。",bonus:"光魔法"},
 {name:"竜人",desc:"総合能力が高い。",bonus:"総合"},
 {name:"スライム",desc:"特殊な身体を持つ。",bonus:"耐性"},
 {name:"アンデッド",desc:"毒などに強い。",bonus:"毒耐性"},
 {name:"精霊",desc:"魔法適性が高い。",bonus:"魔法"},
 {name:"人魚",desc:"水属性に強い。",bonus:"水魔法"},
 {name:"巨人族",desc:"巨大な体と高HP。",bonus:"HP・DEF"}
];

const jobs=[
 {name:"見習い騎士",type:"騎士",desc:"騎士を目指す新人。",sp:2},
 {name:"村の騎士",type:"騎士",desc:"村を守る新人騎士。",sp:2},
 {name:"新米守衛",type:"騎士",desc:"門を守る新人。",sp:2},
 {name:"盾持ち",type:"騎士",desc:"盾を扱う。",sp:2},
 {name:"槍持ち",type:"騎士",desc:"槍を扱う。",sp:2},

 {name:"魔法見習い",type:"魔法使い",desc:"魔法を学び始めた。",sp:3},
 {name:"杖持ち",type:"魔法使い",desc:"杖を使う新人。",sp:3},
 {name:"火種使い",type:"魔法使い",desc:"小さな火を操る。",sp:3},
 {name:"水滴使い",type:"魔法使い",desc:"水を操る。",sp:3},
 {name:"そよ風使い",type:"魔法使い",desc:"小さな風を起こす。",sp:3},

 {name:"木刀使い",type:"剣士",desc:"木刀で鍛える。",sp:2},
 {name:"剣士見習い",type:"剣士",desc:"剣術を学ぶ。",sp:2},
 {name:"村の剣士",type:"剣士",desc:"村を守る剣士。",sp:2},
 {name:"新米剣士",type:"剣士",desc:"冒険を始めた新人。",sp:2},
 {name:"素振り剣士",type:"剣士",desc:"鍛錬を続ける剣士。",sp:2},

 {name:"農家",type:"非戦闘職",desc:"作物を育てる。",sp:4},
 {name:"採集家",type:"非戦闘職",desc:"素材を集める。",sp:4},
 {name:"木こり",type:"非戦闘職",desc:"木材を集める。",sp:4},
 {name:"鉱夫",type:"非戦闘職",desc:"鉱石を掘る。",sp:4},
 {name:"釣り師",type:"非戦闘職",desc:"魚を釣る。",sp:4},
 {name:"料理人",type:"非戦闘職",desc:"料理を作る。",sp:4},
 {name:"商人",type:"非戦闘職",desc:"売買を得意とする。",sp:4},
 {name:"鍛冶見習い",type:"非戦闘職",desc:"武器を作る。",sp:4},
 {name:"地図描き",type:"非戦闘職",desc:"世界を地図にする。",sp:4},
 {name:"村人",type:"非戦闘職",desc:"普通の村人。",sp:5}
];

const skillTrees={
 "剣士":[["剣術","強撃","連撃","会心斬り"],["受け流し","防御姿勢","反撃","鉄壁"],["身軽","疾走","高速斬撃","瞬歩"]],
 "騎士":[["盾術","シールドバッシュ","守護","大盾"],["防御訓練","鉄壁","守護陣","不屈"],["槍術","突進","貫通突き","騎士突撃"]],
 "魔法使い":[["魔力操作","火球","大火球","爆炎"],["水魔法","氷結","氷槍","絶対零度"],["魔力回復","魔力増幅","詠唱短縮","大魔法"]],
 "非戦闘職":[["採集術","素材発見","希少素材発見","宝探し"],["生活術","料理強化","制作強化","職人の心得"],["商才","値引き","高値売却","大商人"]]
};

/* =========================================================
   PLAYER
========================================================= */

let player={
 name:"冒険者",race:"人間",job:"見習い騎士",
 level:1,exp:0,expNext:100,sp:0,gold:100,
 maxHP:100,hp:100,maxMP:30,mp:30,
 str:10,def:10,int:10,mnd:10,agi:10,
 learned:[]
};

let selectedRace="人間";
let selectedJob="見習い騎士";

function openCreation(){
 document.getElementById("home").style.display="none";
 document.getElementById("creation").style.display="block";
 renderRaces();renderJobs();
}

function backHome(){
 document.getElementById("creation").style.display="none";
 document.getElementById("home").style.display="flex";
}

function renderRaces(){
 const box=document.getElementById("raceCards");
 box.innerHTML="";
 races.forEach(r=>{
  const c=document.createElement("button");
  c.className="selectCard"+(r.name===selectedRace?" selected":"");
  c.innerHTML=`<div class="cardName">${r.name}</div>
  <div class="cardDesc">${r.desc}</div>
  <div class="stat">特徴：${r.bonus}</div>`;
  c.onclick=()=>{selectedRace=r.name;renderRaces()};
  box.appendChild(c);
 });
}

function renderJobs(){
 const box=document.getElementById("jobCards");
 box.innerHTML="";
 jobs.forEach(j=>{
  const c=document.createElement("button");
  c.className="selectCard"+(j.name===selectedJob?" selected":"");
  c.innerHTML=`<div class="cardName">${j.name}</div>
  <div class="cardDesc">${j.desc}</div>
  <div class="stat">${j.type} / SP +${j.sp}</div>`;
  c.onclick=()=>{selectedJob=j.name;renderJobs()};
  box.appendChild(c);
 });
}

function startGame(){

 player.name=document.getElementById("nameInput").value.trim()||"冒険者";
 player.race=selectedRace;
 player.job=selectedJob;

 const job=jobs.find(j=>j.name===selectedJob);

 player.maxHP=100;player.maxMP=30;
 player.str=10;player.def=10;player.int=10;player.mnd=10;player.agi=10;

 if(player.race==="オーク"){player.maxHP+=25}
 if(player.race==="ドワーフ"){player.def+=4;player.maxHP+=15}
 if(player.race==="獣人"){player.agi+=4;player.str+=2}
 if(player.race==="エルフ"){player.int+=4;player.mnd+=3}
 if(player.race==="竜人"){player.str+=3;player.def+=3;player.int+=2}

 if(job.type==="騎士"){player.maxHP+=20;player.def+=4}
 if(job.type==="剣士"){player.str+=4;player.agi+=3}
 if(job.type==="魔法使い"){player.maxMP+=30;player.int+=5;player.mnd+=3}

 player.hp=player.maxHP;
 player.mp=player.maxMP;

 document.getElementById("creation").style.display="none";
 document.getElementById("game").style.display="block";

 init3D();
 updateHUD();
 showMessage(`${player.name}、広大な世界へようこそ！`);
}

function showJobBook(){
 alert(`【異世界オンライン】

初期職業は100種類。
騎士25 / 魔法使い25 / 剣士25 / 非戦闘職25

冒険を進めると上位職・特殊職・隠し職が登場します。

種族も今後さらに追加予定です。`);
}

function showSettings(){
 alert(`【設定】
WASD：移動
E：攻撃
M：メニュー
SPACE：ジャンプ
SHIFT：ダッシュ

iPad：
左スティック＝移動
右側スワイプ＝カメラ
ボタン＝攻撃・ジャンプ・ダッシュ`);
}

/* =========================================================
   THREE
========================================================= */

let scene,camera,renderer,controls;
let playerObject;
let monsters=[];
let keys={};
let joystick={x:0,y:0};
let jumpPower=0;

function init3D(){

 if(scene)return;

 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x87b8e8);
 scene.fog=new THREE.Fog(0x87b8e8,70,260);

 camera=new THREE.PerspectiveCamera(
  60,innerWidth/innerHeight,.1,500
 );

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;

 document.getElementById("game").appendChild(renderer.domElement);

 const hemi=new THREE.HemisphereLight(0xffffff,0x506040,1.8);
 scene.add(hemi);

 const sun=new THREE.DirectionalLight(0xffffff,2.2);
 sun.position.set(80,120,50);
 sun.castShadow=true;
 scene.add(sun);

 /* 巨大な地面 */
 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),
  new THREE.MeshStandardMaterial({color:0x4f8848})
 );
 ground.rotation.x=-Math.PI/2;
 ground.receiveShadow=true;
 scene.add(ground);

 createRoadNetwork();
 createTown();
 createPlaza();
 createTownWalls();
 createGate();

 /* 街の外 */
 createForest();
 createFarm();
 createLake();

 /* プレイヤー */
 createPlayer();

 /* モンスター */
 createMonster("スライム",35,0,-80,30);
 createMonster("ゴブリン",-40,0,-105,50);
 createMonster("ウルフ",60,0,-125,70);
 createMonster("スライム",-75,0,-145,30);
 createMonster("ゴブリン",90,0,-165,50);
 createMonster("ウルフ",-110,0,-185,70);

 camera.position.set(0,8,18);

 controls=new THREE.OrbitControls(
  camera,renderer.domElement
 );
 controls.enablePan=false;
 controls.enableZoom=false;
 controls.enableDamping=true;
 controls.target.set(0,1,0);

 setupControls();
 animate();
}

/* =========================================================
   巨大な街
========================================================= */

function createRoadNetwork(){

 const roadMat=new THREE.MeshStandardMaterial({
  color:0x9b8060
 });

 /* 大通り */
 const roads=[
  [0,.08,0,18,.1,420],
  [0,.09,0,420,.1,18],
  [-90,.08,0,12,.1,260],
  [90,.08,0,12,.1,260],
  [0,.08,-80,220,.1,12],
  [0,.08,80,220,.1,12]
 ];

 roads.forEach(r=>{
  const mesh=new THREE.Mesh(
   new THREE.BoxGeometry(r[3],r[4],r[5]),
   roadMat
  );
  mesh.position.set(r[0],r[1],r[2]);
  scene.add(mesh);
 });

 /* 小道 */
 for(let x=-80;x<=80;x+=40){
  const road=new THREE.Mesh(
   new THREE.BoxGeometry(7,.08,170),
   roadMat
  );
  road.position.set(x,.09,0);
  scene.add(road);
 }

 for(let z=-60;z<=60;z+=40){
  const road=new THREE.Mesh(

/* =========================================================

========================================================= */

function openMenu(){
 document.getElementById("menu").style.display="block";
 renderMenu();
}

function closeMenu(){
 document.getElementById("menu").style.display="none";
}

function renderMenu(){

 document.getElementById("menuStatus").innerHTML=`
 <b>${player.name}</b><br>
 種族：${player.race}<br>
 職業：${player.job}<br>
 Lv.${player.level}<br>
 HP ${player.hp}/${player.maxHP}<br>
 MP ${player.mp}/${player.maxMP}<br>
 SP ${player.sp}　G ${player.gold}<br>
 STR ${player.str}　DEF ${player.def}<br>
 INT ${player.int}　MND ${player.mnd}　AGI ${player.agi}`;

 const list=document.getElementById("skillList");
 list.innerHTML="";

 const type=jobs.find(j=>j.name===player.job)?.type||"剣士";
 const trees=skillTrees[type]||skillTrees["剣士"];

 trees.forEach((tree,index)=>{

  const title=document.createElement("h4");
  title.textContent=`スキルツリー ${index+1}`;
  list.appendChild(title);

  tree.forEach((skill,i)=>{

   const key=`${type}-${index}-${i}`;

   const div=document.createElement("div");
   div.className="skill"+(player.learned.includes(key)?" learned":"");

   div.innerHTML=`
    <b>${skill}</b><br>
    <span class="small">${i===0?"基本スキル":"上位スキル"}</span>`;

   if(!player.learned.includes(key)){

    const btn=document.createElement("button");
    btn.textContent="5 SP";
    btn.onclick=()=>learnSkill(key,skill);
    div.appendChild(btn);

   }else{

    div.innerHTML+=
     `<br><span style="color:#ffe16b">習得済み</span>`;
   }

   list.appendChild(div);
  });
 });
}

function learnSkill(key,name){

 if(player.sp<5){
  showMessage("SPが足りない！");
  return;
 }

 player.sp-=5;
 player.learned.push(key);

 showMessage(`${name}を習得した！`);

 updateHUD();
 renderMenu();
}

/* =========================================================
   EXP
========================================================= */

function gainExp(amount){

 player.exp+=amount;

 while(player.exp>=player.expNext){

  player.exp-=player.expNext;
  player.level++;
  player.expNext=Math.floor(player.expNext*1.25);

  const job=jobs.find(j=>j.name===player.job);
  const gain=job?job.sp:2;

  player.sp+=gain;

  player.maxHP+=10;
  player.maxMP+=4;

  player.str+=2;
  player.def+=2;
  player.int+=2;
  player.mnd+=2;
  player.agi+=2;

  player.hp=player.maxHP;
  player.mp=player.maxMP;

  showMessage(`レベルアップ！ Lv.${player.level} / SP +${gain}`);
 }

 updateHUD();
}

/* =========================================================
   ATTACK
========================================================= */

function attackNearest(){

 if(!playerObject)return;

 let target=null;
 let dist=999;

 monsters.forEach(m=>{
  if(!m.visible||m.userData.hp<=0)return;

  const d=playerObject.position.distanceTo(m.position);

  if(d<dist){
   dist=d;
   target=m;
  }
 });

 if(!target){
  showMessage("近くに敵がいない。");
  return;
 }

 if(dist>6){
  showMessage("敵に近づいてください。");
  return;
 }

 const damage=Math.floor(player.str*1.8);

 target.userData.hp-=damage;

 showMessage(`${target.userData.name}に${damage}ダメージ！`);

 if(target.userData.hp<=0){

  target.visible=false;

  gainExp(target.userData.maxHP);
  player.gold+=target.userData.maxHP;

  showMessage(`${target.userData.name}を倒した！`);
 }

 updateHUD();
}

function jump(){

 if(playerObject)jumpPower=.22;
}

function dash(){

 if(!playerObject)return;

 const dir=new THREE.Vector3();
 camera.getWorldDirection(dir);
 dir.y=0;
 dir.normalize();

 playerObject.position.add(dir.multiplyScalar(4));
}

/* =========================================================
   CONTROLS
========================================================= */

function setupControls(){

 addEventListener("keydown",e=>{

  keys[e.key.toLowerCase()]=true;

  if(e.key===" ")jump();
  if(e.key.toLowerCase()==="e")attackNearest();
  if(e.key.toLowerCase()==="m")openMenu();
 });

 addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
 });

 const joy=document.getElementById("joystick");
 const knob=document.getElementById("knob");

 let active=false;

 joy.addEventListener("pointerdown",e=>{
  active=true;
  joy.setPointerCapture(e.pointerId);
 });

 joy.addEventListener("pointermove",e=>{

  if(!active)return;

  const rect=joy.getBoundingClientRect();

  let x=e.clientX-(rect.left+rect.width/2);
  let y=e.clientY-(rect.top+rect.height/2);

  const max=38;
  const len=Math.hypot(x,y);

  if(len>max){
   x=x/len*max;
   y=y/len*max;
  }

  knob.style.transform=`translate(${x}px,${y}px)`;

  joystick.x=x/max;
  joystick.y=y/max;
 });

 const reset=()=>{
  active=false;
  joystick.x=0;
  joystick.y=0;
  knob.style.transform="translate(0,0)";
 };

 joy.addEventListener("pointerup",reset);
 joy.addEventListener("pointercancel",reset);

 const area=document.getElementById("cameraArea");

 let lastX=0;
 let lastY=0;
 let cameraDrag=false;

 area.addEventListener("pointerdown",e=>{
  cameraDrag=true;
  lastX=e.clientX;
  lastY=e.clientY;
 });

 area.addEventListener("pointermove",e=>{

  if(!cameraDrag)return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  lastX=e.clientX;
  lastY=e.clientY;

  controls.rotateLeft(dx*.005);
  controls.rotateUp(dy*.005);
 });

 area.addEventListener("pointerup",()=>cameraDrag=false);
 area.addEventListener("pointercancel",()=>cameraDrag=false);
}

/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(){

 if(!playerObject)return;

 let x=0,z=0;

 if(keys["w"])z-=1;
 if(keys["s"])z+=1;
 if(keys["a"])x-=1;
 if(keys["d"])x+=1;

 x+=joystick.x;
 z+=joystick.y;

 const len=Math.hypot(x,z);

 if(len>1){
  x/=len;
  z/=len;
 }

 const speed=keys["shift"]?.22:.11;

 playerObject.position.x+=x*speed;
 playerObject.position.z+=z*speed;

 if(jumpPower>0){
  playerObject.position.y+=jumpPower;
  jumpPower-=.012;
 }

 if(playerObject.position.y<0){
  playerObject.position.y=0;
  jumpPower=0;
 }

 /* 世界の端 */
 playerObject.position.x=
  THREE.MathUtils.clamp(playerObject.position.x,-235,235);

 playerObject.position.z=
  THREE.MathUtils.clamp(playerObject.position.z,-235,235);

 if(controls){

  controls.target.lerp(
   new THREE.Vector3(
    playerObject.position.x,
    1.5,
    playerObject.position.z
   ),.12
  );
 }
}

/* =========================================================
   BATTLE
========================================================= */

let currentEnemy=null;

function startBattle(enemy){

 currentEnemy=enemy;

 document.getElementById("battleUI").style.display="block";
 document.getElementById("enemyName").textContent=enemy.userData.name;

 document.getElementById("battleLog").innerHTML=
  `<div>${enemy.userData.name}が現れた！</div>`;

 updateBattle();
}

function updateBattle(){

 if(!currentEnemy)return;

 const hp=Math.max(0,currentEnemy.userData.hp);
 const max=currentEnemy.userData.maxHP;

 document.getElementById("enemyHP").style.width=
  `${hp/max*100}%`;

 document.getElementById("enemyStatus").textContent=
  `HP ${hp} / ${max}`;
}

function battleLog(text){

 const log=document.getElementById("battleLog");
 log.innerHTML+=`<div>${text}</div>`;
 log.scrollTop=log.scrollHeight;
}

function battleAttack(){

 if(!currentEnemy)return;

 const damage=Math.floor(player.str*1.5);

 currentEnemy.userData.hp-=damage;

 battleLog(`${player.name}の攻撃！ ${damage}ダメージ！`);

 updateBattle();

 if(currentEnemy.userData.hp<=0){

  battleLog(`${currentEnemy.userData.name}を倒した！`);

  gainExp(currentEnemy.userData.maxHP);
  player.gold+=currentEnemy.userData.maxHP;

  currentEnemy.visible=false;

  setTimeout(endBattle,600);

 }else{
  enemyAttackTurn();
 }
}

function battleSkill(){

 if(player.sp<5){
  battleLog("SPが足りない！");
  return;
 }

 player.sp-=5;

 const damage=Math.floor(player.int*2.5+player.str);

 currentEnemy.userData.hp-=damage;

 battleLog(`スキル発動！ ${damage}ダメージ！`);

 updateBattle();
 updateHUD();

 if(currentEnemy.userData.hp<=0){

  battleLog("敵を倒した！");

  gainExp(currentEnemy.userData.maxHP*2);
  player.gold+=currentEnemy.userData.maxHP*2;

  currentEnemy.visible=false;

  setTimeout(endBattle,600);

 }else{
  enemyAttackTurn();
 }
}

function battleGuard(){
 battleLog(`${player.name}は防御した！`);
 enemyAttackTurn(true);
}

function battleEscape(){

 if(Math.random()<.7){
  battleLog("うまく逃げ切った！");
  setTimeout(endBattle,500);
 }else{
  battleLog("逃げられない！");
  enemyAttackTurn();
 }
}

function enemyAttackTurn(guard=false){

 let damage=Math.max(
  1,
  Math.floor(currentEnemy.userData.maxHP*.18)
 );

 if(guard)damage=Math.floor(damage*.5);

 player.hp=Math.max(0,player.hp-damage);

 battleLog(
  `${currentEnemy.userData.name}の攻撃！ ${damage}ダメージ！`
 );

 updateHUD();

 if(player.hp<=0){

  battleLog("力尽きた……");

  setTimeout(()=>{
   player.hp=player.maxHP;
   endBattle();
   playerObject.position.set(0,0,65);
   showMessage("街の入口まで戻された。");
  },1000);
 }
}

function endBattle(){
 document.getElementById("battleUI").style.display="none";
 currentEnemy=null;
 updateHUD();
}

/* =========================================================
   ENCOUNTER
========================================================= */

let encounterTimer=0;

function checkEncounter(delta){

 encounterTimer+=delta;

 if(encounterTimer<5)return;
 encounterTimer=0;

 if(!playerObject)return;

 /* 街の中心から離れたらエンカウント */
 if(Math.abs(playerObject.position.x)>115 ||
    playerObject.position.z<-130){

  if(Math.random()<.07){

   const alive=monsters.filter(m=>m.visible);

   if(alive.length){

    const enemy=
     alive[Math.floor(Math.random()*alive.length)];

    if(playerObject.position.distanceTo(enemy.position)<15){
     startBattle(enemy);
    }
   }
  }
 }
}

/* =========================================================
   MAIN LOOP
========================================================= */

let lastTime=performance.now();

function animate(){

 requestAnimationFrame(animate);

 const now=performance.now();
 const delta=(now-lastTime)/1000;
 lastTime=now;

 updateMovement();
 checkEncounter(delta);

 /* 敵が近づいてくる */
 monsters.forEach(m=>{

  if(!m.visible)return;

  const dist=m.position.distanceTo(playerObject.position);

  if(dist<15&&dist>4){

   const dir=new THREE.Vector3()
    .subVectors(playerObject.position,m.position)
    .normalize();

   m.position.x+=dir.x*.01;
   m.position.z+=dir.z*.01;
  }
 });

 controls.update();

 renderer.render(scene,camera);
}

/* =========================================================
   RESIZE
========================================================= */

addEventListener("resize",()=>{

 if(!camera||!renderer)return;

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
