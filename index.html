<title>異世界オンライン</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:system-ui,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

#hud,#menu,#help,#msg{
  position:fixed;
  z-index:5;
  color:white;
  background:#08101dcc;
  border:1px solid #ffffff30;
  border-radius:12px;
  padding:12px;
  box-sizing:border-box;
}

#hud{
  top:15px;
  left:15px;
  min-width:270px;
}

.bar{
  height:9px;
  background:#333;
  border-radius:9px;
  overflow:hidden;
  margin:3px 0 7px;
}

.fill{
  height:100%;
  background:#48d17a;
}

.mp .fill{
  background:#4d8cff;
}

#help{
  bottom:15px;
  left:15px;
  font-size:13px;
}

#menu{
  right:15px;
  top:15px;
  width:340px;
  max-height:82vh;
  overflow:auto;
  display:none;
}

#msg{
  left:50%;
  bottom:65px;
  transform:translateX(-50%);
  display:none;
}

button{
  background:#2c4772;
  color:#fff;
  border:0;
  border-radius:7px;
  padding:8px 12px;
  cursor:pointer;
}

button:hover{
  background:#41659a;
}

.skill{
  background:#ffffff0d;
  padding:8px;
  margin:5px 0;
  border-radius:7px;
}

.locked{
  opacity:.55;
}

#cross{
  position:fixed;
  left:50%;
  top:50%;
  z-index:4;
  color:white;
  font-size:22px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

#loading{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  color:white;
  background:#000d;
  padding:18px 24px;
  border-radius:12px;
}

/* iPad / touch */
#touch{
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}

#stick{
  position:absolute;
  left:25px;
  bottom:35px;
  width:145px;
  height:145px;
  border-radius:50%;
  background:#ffffff22;
  border:2px solid #ffffff55;
  pointer-events:auto;
  touch-action:none;
}

#knob{
  position:absolute;
  left:45px;
  top:45px;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#ffffff66;
  border:2px solid #fff8;
}

.actions{
  position:absolute;
  right:20px;
  bottom:25px;
  display:grid;
  grid-template-columns:70px 70px;
  gap:10px;
  pointer-events:auto;
}

.tbtn{
  width:70px;
  height:70px;
  border-radius:50%;
  border:1px solid #fff6;
  background:#162746dd;
  color:#fff;
  font-weight:bold;
  font-size:13px;
  touch-action:none;
}

.cam{
  position:absolute;
  right:0;
  top:0;
  width:55%;
  height:70%;
  pointer-events:auto;
  touch-action:none;
}

@media(pointer:coarse){
  #touch{
    display:block;
  }

  #help{
    display:none;
  }
}
</style>
</head>

/* =====================================================

   マテリアル・オブジェクト
===================================================== */

function mat(color){
  return new THREE.MeshStandardMaterial({
    color:color
  });
}

function box(
  x,y,z,
  w,h,d,
  color
){

  const m =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      mat(color)
    );

  m.position.set(
    x,y,z
  );

  m.castShadow = true;
  m.receiveShadow = true;

  scene.add(m);

  return m;
}

  g.add(b);

  scene.add(g);

  monsters.push({
    g:g,
    hp:35,
    maxhp:35,
    alive:true
  });
}

/* =====================================================
   入力
===================================================== */

const keys={};

addEventListener(
  "keydown",
  e=>{

    keys[e.code]=true;

    if(
      e.code==="Space" &&
      grounded
    ){

      vy=8;
      grounded=false;
    }

    if(e.code==="KeyM"){
      menu();
    }

    if(e.code==="KeyE"){

/* =====================================================
   HUD
===================================================== */

function hud(){

  document.querySelector("#lv")
    .textContent=state.lv;

  document.querySelector("#xp")
    .textContent=state.xp;

  document.querySelector("#sp")
    .textContent=state.sp;

  document.querySelector("#gold")
    .textContent=state.gold;

  document.querySelector("#hp")
    .textContent=state.hp;

  document.querySelector("#maxhp")
    .textContent=state.maxhp;

  document.querySelector("#mp")
    .textContent=state.mp;

  document.querySelector("#maxmp")
    .textContent=state.maxmp;

  document.querySelector("#job")
    .textContent=state.job;

  document.querySelector("#race")
    .textContent=state.race;

  document.querySelector("#hpbar")
    .style.width=
      Math.max(
        0,
        state.hp/state.maxhp*100
      )+"%";

  document.querySelector("#mpbar")
    .style.width=
      Math.max(
        0,
        state.mp/state.maxmp*100
      )+"%";
}


/* =====================================================
   メッセージ
===================================================== */

function msg(text){

  const e=
    document.querySelector("#msg");

  e.textContent=text;
  e.style.display="block";

  clearTimeout(msg.timer);

  msg.timer=setTimeout(
    ()=>{
      e.style.display="none";
    },
    1600
  );
}


/* =====================================================
   スキルメニュー
===================================================== */

const learned=new Set();

function menu(){

  const e=
    document.querySelector("#menu");

  if(e.style.display==="block"){

    e.style.display="none";

    return;
  }


  let html=`

    <h2>⚔ キャラクター</h2>

    <p>
      Lv.${state.lv}
     　
      ${state.race}
      /
      ${state.job}
    </p>

    <p>
      STR ${state.str}
      　
      DEF ${state.def}
      　
      AGI ${state.agi}
    </p>

    <p>
      スキルポイント：
      <b>${state.sp}</b>
    </p>

    <hr>

    <h2>✨ スキルツリー</h2>
  `;


  jobs[state.job].trees.forEach(
    (tree,treeIndex)=>{

      html+=`
        <h3>${tree[0]}</h3>
      `;


      tree[1].forEach(
        (skill,skillIndex)=>{

          const cost=
            5 + skillIndex*2;

          const id=
            treeIndex+"-"+skillIndex;

          const isLearned=
            learned.has(id);

          let button="";

          if(
            !isLearned &&
            state.sp>=cost
          ){

            button=`
              <button
                onclick="learnSkill('${id}','${skill}',${cost})">
                習得
              </button>
            `;
          }

          html+=`

            <div class="skill
              ${isLearned ? "" : "locked"}">

              ${isLearned ? "✅" : "🔒"}
              ${skill}
              (${cost}SP)

              ${button}

            </div>
          `;
        }
      );
    }
  );


  html+=`

    <hr>

    <h3>装備</h3>

    <p>
      ⚔️ 初心者の双剣<br>
      🛡️ 布の服<br>
      💍 旅人のお守り
    </p>

    <button onclick="closeMenu()">
      閉じる
    </button>

  `;


  e.innerHTML=html;
  e.style.display="block";
}


function closeMenu(){

  document.querySelector("#menu")
    .style.display="none";
}


/* =====================================================
   スキル習得
===================================================== */

window.learnSkill=
function(
  id,
  skill,
  cost
){

  if(
    state.sp>=cost &&
    !learned.has(id)
  ){

    state.sp-=cost;

    learned.add(id);

    hud();

    msg(
      skill+"を習得！"
    );

    /* メニューを更新 */
    document.querySelector("#menu")
      .style.display="none";

    menu();
  }
};


/* =====================================================
   経験値
===================================================== */

function gainXP(amount){

  state.xp+=amount;

  while(state.xp>=100){

    state.xp-=100;

    state.lv++;

    const gain=
      jobs[state.job].gain;

    state.sp+=gain;

    state.maxhp+=7;
    state.hp=state.maxhp;

    state.maxmp+=3;
    state.mp=state.maxmp;

    state.str+=2;
    state.def++;
    state.agi++;

    msg(
      "LvUP！  +"+gain+"SP"
    );
  }

  hud();
}


/* =====================================================
   攻撃
===================================================== */

function attack(){

  let target=null;
  let distance=999;

  for(
    const m of monsters
  ){

    if(!m.alive) continue;

    const d=
      player.position.distanceTo(
        m.g.position
      );

    if(d<distance){

      distance=d;
      target=m;
    }
  }


  if(
    target &&
    distance<4
  ){

    const damage=
      18 + state.str;

    target.hp-=damage;

    msg(
      "⚔ 攻撃！ "+damage+"ダメージ"
    );


    if(target.hp<=0){

      target.alive=false;

      scene.remove(
        target.g
      );

      state.gold+=20;

      gainXP(35);

      msg(
        "モンスター撃破！ +35EXP"
      );
    }
  }
  else{

    msg(
      "近くに敵がいない！"
    );
  }
}


/* =====================================================
   プレイヤー移動
===================================================== */

let vy=0;
let grounded=true;

const touchMove={
  x:0,
  z:0
};

function move(dt){

  const direction=
    new THREE.Vector3();


  /* キーボード */
  if(keys.KeyW)
    direction.z--;

  if(keys.KeyS)
    direction.z++;

  if(keys.KeyA)
    direction.x--;

  if(keys.KeyD)
    direction.x++;


  /* タッチ */
  direction.x+=touchMove.x;
  direction.z+=touchMove.z;


  if(direction.length()>0){

    direction.normalize();

    const speed=
      keys.ShiftLeft ||
      keys.ShiftRight
        ? 9
        : 5;

    player.position.addScaledVector(
      direction,
      speed*dt
    );

    player.rotation.y=
      Math.atan2(
        direction.x,
        direction.z
      );
  }


  /* 重力 */
  vy-=20*dt;

  player.position.y+=
    vy*dt;


  if(player.position.y<=0){

    player.position.y=0;

    vy=0;

    grounded=true;
  }


  /* 世界の外に出ない */
  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -120,
      120
    );

  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -120,
      120
    );
}


/* =====================================================
   カメラ
   OrbitControlsは完全に使用しない
===================================================== */

let camYaw=0;
let camPitch=0.35;

let cameraDistance=8;

function updateCamera(){

  const target=
    new THREE.Vector3(
      player.position.x,
      player.position.y+1.4,
      player.position.z
    );


  const horizontal=
    Math.cos(camPitch)*
    cameraDistance;

  const y=
    Math.sin(camPitch)*
    cameraDistance;


  const offset=
    new THREE.Vector3(
      Math.sin(camYaw)*horizontal,
      y,
      Math.cos(camYaw)*horizontal
    );


  const desired=
    target.clone()
      .add(offset);


  camera.position.lerp(
    desired,
    0.14
  );

  camera.lookAt(target);
}

let last=
  performance.now();

function loop(time){

  const dt=
    Math.min(
      (time-last)/1000,
      .05
    );

  last=time;

  move(dt);

  updateCamera();

  renderer.render(
    scene,
    camera
  );

  requestAnimationFrame(loop);
}


/* =====================================================
   タッチ操作
===================================================== */

const stick=
  document.querySelector("#stick");

const knob=
  document.querySelector("#knob");

let stickId=null;


function setStick(x,y){

  const r=
    stick.getBoundingClientRect();

  const cx=
    r.left+r.width/2;

  const cy=
    r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=45;

  const len=
    Math.hypot(dx,dy);

  if(len>max){

    dx=dx/len*max;
    dy=dy/len*max;
  }


  knob.style.transform=
    `translate(${dx}px,${dy}px)`;


  touchMove.x=
    dx/max;

  touchMove.z=
    dy/max;
}


stick.addEventListener(
  "pointerdown",
  e=>{

    stickId=e.pointerId;

    stick.setPointerCapture(
      e.pointerId
    );

    setStick(
      e.clientX,
      e.clientY
    );
  }
);


stick.addEventListener(
  "pointermove",
  e=>{

    if(
      e.pointerId===stickId
    ){

      setStick(
        e.clientX,
        e.clientY
      );
    }
  }
);


function resetStick(){

  stickId=null;

  knob.style.transform=
    "translate(0,0)";

  touchMove.x=0;
  touchMove.z=0;
}


stick.addEventListener(
  "pointerup",
  resetStick
);

stick.addEventListener(
  "pointercancel",
  resetStick
);


/* =====================================================
   タッチカメラ
===================================================== */

const cam=
  document.querySelector("#cam");

let camId=null;
let lastX=0;
let lastY=0;


cam.addEventListener(
  "pointerdown",
  e=>{

    camId=e.pointerId;

    lastX=e.clientX;
    lastY=e.clientY;

    cam.setPointerCapture(
      e.pointerId
    );
  }
);


cam.addEventListener(
  "pointermove",
  e=>{

    if(
      e.pointerId!==camId
    ) return;


    const dx=
      e.clientX-lastX;

    const dy=
      e.clientY-lastY;


    lastX=e.clientX;
    lastY=e.clientY;


    camYaw-=dx*0.008;

    camPitch-=dy*0.006;


    camPitch=
      THREE.MathUtils.clamp(
        camPitch,
        -0.15,
        1.0
      );
  }
);


cam.addEventListener(
  "pointerup",
  ()=>{
    camId=null;
  }
);

cam.addEventListener(
  "pointercancel",
  ()=>{
    camId=null;
  }
);


/* =====================================================
   タッチボタン
===================================================== */

function touchButton(
  id,
  fn
){

  const b=
    document.getElementById(id);

  b.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      fn();
    }
  );
}


touchButton(
  "atk",
  attack
);


touchButton(
  "jump",
  ()=>{

    if(grounded){

      vy=8;
      grounded=false;
    }
  }
);


touchButton(
  "dash",
  ()=>{

    keys.ShiftLeft=true;

    setTimeout(
      ()=>{
        keys.ShiftLeft=false;
      },
      500
    );
  }
);


touchButton(
  "skill",
  ()=>{
    menu();
  }
);


touchButton(
  "menuBtn",
  ()=>{
    menu();
  }
);


/* =====================================================
   リサイズ
===================================================== */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =====================================================
   起動
===================================================== */

hud();

document
  .getElementById("loading")
  .remove();

requestAnimationFrame(loop);

</script>
