<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>異世界オンライン 3D</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    sans-serif;
}

button{
  font-family:inherit;
  cursor:pointer;
}

/* =========================
   ホーム画面
========================= */

#home{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 35%,rgba(90,140,255,.25),transparent 35%),
    linear-gradient(#081226,#02040a);
  color:white;
}

#home::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 70% 30%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 40% 75%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 85% 80%,#fff 0 1px,transparent 2px);
  background-size:180px 150px,240px 190px,210px 170px,260px 200px;
  opacity:.55;
}

.homeBox{
  position:relative;
  width:min(560px,92vw);
  text-align:center;
  padding:35px 25px 30px;
}

.title{
  font-size:clamp(42px,9vw,78px);
  font-weight:900;
  letter-spacing:5px;
  text-shadow:
    0 0 10px #7db7ff,
    0 0 35px #315bff,
    4px 5px 0 #111;
  margin-bottom:5px;
}

.subtitle{
  color:#b9d7ff;
  letter-spacing:8px;
  font-size:14px;
  margin-bottom:35px;
}

.homeButton{
  display:block;
  width:100%;
  max-width:390px;
  margin:12px auto;
  padding:16px 20px;
  border:2px solid rgba(255,255,255,.65);
  border-radius:10px;
  background:linear-gradient(#243e69,#10213c);
  color:#fff;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 5px 18px rgba(0,0,0,.5);
}

.homeButton:hover{
  background:linear-gradient(#416ba8,#18345d);
  transform:translateY(-2px);
}

.homeButton.main{
  font-size:25px;
  border-color:#9ed0ff;
  background:linear-gradient(#3978c7,#183967);
}

.version{
  margin-top:25px;
  color:#71819b;
  font-size:12px;
}

/* =========================
   キャラ作成画面
========================= */

#creation{
  position:fixed;
  inset:0;
  z-index:900;
  display:none;
  color:white;
  background:
    radial-gradient(circle at 50% 20%,#254b78,transparent 45%),
    #060a12;
  overflow:auto;
  padding:25px;
}

.createBox{
  width:min(1000px,100%);
  margin:auto;
  padding-bottom:30px;
}

.createTitle{
  text-align:center;
  font-size:34px;
  margin:5px 0 25px;
}

.section{
  margin:18px 0;
  padding:18px;
  border:1px solid #45617f;
  border-radius:12px;
  background:rgba(8,18,32,.88);
}

.section h2{
  margin:0 0 14px;
  font-size:21px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:10px;
}

.selectCard{
  padding:15px 10px;
  border:2px solid #35475d;
  border-radius:10px;
  background:#101b2b;
  color:white;
  text-align:left;
}

.selectCard:hover{
  border-color:#78b9ff;
}

.selectCard.selected{
  border-color:#ffe27a;
  background:linear-gradient(#263c5c,#172337);
  box-shadow:0 0 14px rgba(255,220,100,.25);
}

.cardName{
  font-weight:bold;
  font-size:17px;
}

.cardDesc{
  color:#9eb1c9;
  font-size:12px;
  margin-top:5px;
  line-height:1.5;
}

.stat{
  margin-top:6px;
  font-size:11px;
  color:#d8e7ff;
}

.nameInput{
  width:100%;
  max-width:500px;
  padding:13px;
  border-radius:8px;
  border:1px solid #536b87;
  background:#0b1320;
  color:white;
  font-size:18px;
}

.startGame{
  display:block;
  width:min(450px,100%);
  margin:25px auto 5px;
  padding:17px;
  border:2px solid #ffd968;
  border-radius:10px;
  background:linear-gradient(#80651e,#4c3b10);
  color:#fff;
  font-size:22px;
  font-weight:bold;
}

/* =========================
   ゲーム
========================= */

#game{
  position:fixed;
  inset:0;
  display:none;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  left:15px;
  top:15px;
  z-index:20;
  color:white;
  min-width:245px;
  padding:12px;
  border-radius:10px;
  background:rgba(5,10,18,.78);
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 4px 15px #0008;
}

#playerName{
  font-size:19px;
  font-weight:bold;
}

.small{
  font-size:12px;
  color:#b9c7d8;
}

.bar{
  width:220px;
  height:10px;
  background:#202936;
  border-radius:8px;
  overflow:hidden;
  margin-top:5px;
}

.barFill{
  height:100%;
  width:100%;
}

.hpFill{background:#e74c3c}
.mpFill{background:#3498db}
.expFill{background:#f1c40f}

#message{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  padding:9px 18px;
  color:white;
  background:rgba(0,0,0,.7);
  border-radius:8px;
  pointer-events:none;
}

/* =========================
   メニュー
========================= */

#menu{
  display:none;
  position:fixed;
  right:18px;
  top:18px;
  z-index:100;
  width:min(400px,92vw);
  max-height:85vh;
  overflow:auto;
  color:white;
  background:rgba(8,13,22,.96);
  border:1px solid #6985a5;
  border-radius:12px;
  padding:18px;
}

#menu h2{
  margin-top:0;
}

.menuButton{
  width:100%;
  margin:5px 0;
  padding:11px;
  color:white;
  background:#17263a;
  border:1px solid #47627f;
  border-radius:7px;
}

.skill{
  padding:10px;
  margin:7px 0;
  border:1px solid #3e536c;
  border-radius:7px;
  background:#101b2a;
}

.skill button{
  float:right;
  color:white;
  background:#315e91;
  border:0;
  padding:6px 10px;
  border-radius:5px;
}

.skill.learned{
  border-color:#e5c65b;
}

/* =========================
   タッチ操作
========================= */

#touchUI{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:22px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.35);
  pointer-events:auto;
}

#knob{
  position:absolute;
  width:52px;
  height:52px;
  left:35px;
  top:35px;
  border-radius:50%;
  background:rgba(255,255,255,.42);
}

#cameraArea{
  position:absolute;
  left:25%;
  right:0;
  top:0;
  bottom:30%;
  pointer-events:auto;
}

#actions{
  position:absolute;
  right:18px;
  bottom:18px;
  display:grid;
  grid-template-columns:repeat(2,75px);
  gap:10px;
  pointer-events:auto;
}

.touchButton{
  width:75px;
  height:58px;
  border-radius:50%;
  border:1px solid #fff8;
  color:white;
  background:rgba(15,30,50,.75);
  font-weight:bold;
}

@media(pointer:coarse){
  #touchUI{
    display:block;
  }
}

/* 戦闘UI */

#battleUI{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  background:linear-gradient(#111b2c,#070b12);
  color:white;
}

#battleTop{
  padding:20px;
  text-align:center;
}

#enemyName{
  font-size:28px;
  font-weight:bold;
}

.enemyBar{
  width:min(500px,80vw);
  height:18px;
  background:#222;
  margin:10px auto;
  border-radius:10px;
  overflow:hidden;
}

#enemyHP{
  width:100%;
  height:100%;
  background:#e74c3c;
}

#battleLog{
  width:min(700px,90vw);
  height:180px;
  overflow:auto;
  margin:20px auto;
  padding:12px;
  background:#05080d;
  border:1px solid #42536b;
  border-radius:8px;
}

#battleCommands{
  width:min(700px,90vw);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.battleButton{
  padding:18px;
  font-size:18px;
  border-radius:8px;
  border:1px solid #6e819a;
  background:#18283d;
  color:white;
}
</style>
</head>

<body>

<!-- =========================
     ホーム
========================= -->

<div id="home">
  <div class="homeBox">
    <div class="title">異世界オンライン</div>
    <div class="subtitle">ISEKAI ONLINE</div>

    <button class="homeButton main" onclick="openCreation()">
      ▶ はじめる
    </button>

    <button class="homeButton" onclick="showJobBook()">
      📖 職業・種族図鑑
    </button>

    <button class="homeButton" onclick="showSettings()">
      ⚙ 設定
    </button>

    <div class="version">EARLY ACCESS PROTOTYPE</div>
  </div>
</div>

<!-- =========================
     キャラクター作成
========================= -->

<div id="creation">
  <div class="createBox">

    <div class="createTitle">キャラクターを作成</div>

    <div class="section">
      <h2>名前</h2>
      <input
        id="nameInput"
        class="nameInput"
        maxlength="12"
        value="冒険者"
        placeholder="名前を入力"
      >
    </div>

    <div class="section">
      <h2>種族を選択</h2>
      <div id="raceCards" class="cards"></div>
    </div>

    <div class="section">
      <h2>最初の職業を選択</h2>
      <div id="jobCards" class="cards"></div>
    </div>

    <button class="startGame" onclick="startGame()">
      ⚔ このキャラクターで冒険を始める
    </button>

    <button class="homeButton" onclick="backHome()">
      ← ホームへ戻る
    </button>

  </div>
</div>

<!-- =========================
     ゲーム
========================= -->

<div id="game">

  <div id="hud">
    <div id="playerName">冒険者</div>
    <div class="small" id="playerInfo">人間 / 見習い騎士</div>

    <div class="small">HP</div>
    <div class="bar">
      <div id="hpBar" class="barFill hpFill"></div>
    </div>

    <div class="small">MP</div>
    <div class="bar">
      <div id="mpBar" class="barFill mpFill"></div>
    </div>

    <div class="small">EXP</div>
    <div class="bar">
      <div id="expBar" class="barFill expFill"></div>
    </div>

    <div class="small" id="levelInfo">
      Lv.1　SP 0　G 100
    </div>
  </div>

  <div id="message">街を探索しよう。</div>

  <div id="menu">
    <h2>メニュー</h2>
    <div id="menuStatus"></div>
    <hr>

    <h3>スキルツリー</h3>
    <div id="skillList"></div>

    <button class="menuButton" onclick="closeMenu()">閉じる</button>
  </div>

  <!-- 戦闘 -->
  <div id="battleUI">
    <div id="battleTop">
      <div id="enemyName">スライム</div>
      <div class="enemyBar">
        <div id="enemyHP"></div>
      </div>
      <div id="enemyStatus">HP 30 / 30</div>
    </div>

    <div id="battleLog"></div>

    <div id="battleCommands">
      <button class="battleButton" onclick="battleAttack()">⚔ こうげき</button>
      <button class="battleButton" onclick="battleSkill()">✨ スキル</button>
      <button class="battleButton" onclick="battleGuard()">🛡 ぼうぎょ</button>
      <button class="battleButton" onclick="battleEscape()">🏃 にげる</button>
    </div>
  </div>

  <!-- iPad操作 -->
  <div id="touchUI">

    <div id="joystick">
      <div id="knob"></div>
    </div>

    <div id="cameraArea"></div>

    <div id="actions">
      <button class="touchButton" onclick="attackNearest()">⚔<br>攻撃</button>
      <button class="touchButton" onclick="openMenu()">☰<br>MENU</button>
      <button class="touchButton" onclick="jump()">↑<br>ジャンプ</button>
      <button class="touchButton" onclick="dash()">⚡<br>ダッシュ</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>

/* =========================================================
   データ
========================================================= */

const races = [
  {
    name:"人間",
    desc:"バランスの良い種族。成長の自由度が高い。",
    bonus:"全能力バランス"
  },
  {
    name:"エルフ",
    desc:"魔力に優れた森の民。",
    bonus:"INT・MND"
  },
  {
    name:"ドワーフ",
    desc:"頑丈な身体を持つ職人気質の種族。",
    bonus:"DEF・HP"
  },
  {
    name:"獣人",
    desc:"身体能力に優れる。",
    bonus:"AGI・STR"
  },
  {
    name:"小人",
    desc:"小柄で素早い種族。",
    bonus:"AGI・回避"
  },
  {
    name:"妖精",
    desc:"魔法との相性が良い。",
    bonus:"INT"
  },
  {
    name:"鳥人",
    desc:"空を飛ぶ能力を持つ。",
    bonus:"AGI"
  },
  {
    name:"魚人",
    desc:"水中で高い能力を発揮する。",
    bonus:"水適性"
  },
  {
    name:"リザードマン",
    desc:"硬い鱗を持つ戦士種族。",
    bonus:"DEF"
  },
  {
    name:"ゴブリン",
    desc:"成長が少し早い。",
    bonus:"成長速度"
  },
  {
    name:"オーク",
    desc:"高い体力を持つ種族。",
    bonus:"HP"
  },
  {
    name:"魔族",
    desc:"闇属性との相性が良い。",
    bonus:"闇魔法"
  },
  {
    name:"天使",
    desc:"光属性との相性が良い。",
    bonus:"光魔法"
  },
  {
    name:"竜人",
    desc:"全体的に高い能力を持つ。",
    bonus:"総合能力"
  },
  {
    name:"スライム",
    desc:"特殊な身体を持つ。",
    bonus:"状態異常耐性"
  },
  {
    name:"アンデッド",
    desc:"毒などへの耐性を持つ。",
    bonus:"毒耐性"
  },
  {
    name:"精霊",
    desc:"魔法適性が高い。",
    bonus:"魔法"
  },
  {
    name:"人魚",
    desc:"水属性との相性が良い。",
    bonus:"水魔法"
  },
  {
    name:"巨人族",
    desc:"非常に高いHPを持つが遅い。",
    bonus:"HP・DEF"
  }
];

/* 最初の100職業のうち、ここでは代表25職を表示 */
const jobs = [
  {name:"見習い騎士",type:"騎士",desc:"騎士を目指す新人。",sp:2},
  {name:"村の騎士",type:"騎士",desc:"村を守る新人騎士。",sp:2},
  {name:"新米守衛",type:"騎士",desc:"町の門を守る。",sp:2},
  {name:"盾持ち",type:"騎士",desc:"盾を扱う訓練を受けた兵。",sp:2},
  {name:"槍持ち",type:"騎士",desc:"槍を扱う見習い兵。",sp:2},

  {name:"魔法見習い",type:"魔法使い",desc:"魔法を学び始めたばかり。",sp:3},
  {name:"杖持ち",type:"魔法使い",desc:"杖を使う新人魔法使い。",sp:3},
  {name:"火種使い",type:"魔法使い",desc:"小さな火を操る。",sp:3},
  {name:"水滴使い",type:"魔法使い",desc:"水を少し操れる。",sp:3},
  {name:"そよ風使い",type:"魔法使い",desc:"小さな風を起こす。",sp:3},

  {name:"木刀使い",type:"剣士",desc:"木刀で鍛錬する新人。",sp:2},
  {name:"剣士見習い",type:"剣士",desc:"剣術を学ぶ新人。",sp:2},
  {name:"村の剣士",type:"剣士",desc:"村で剣を教わった者。",sp:2},
  {name:"新米剣士",type:"剣士",desc:"冒険を始めたばかり。",sp:2},
  {name:"素振り剣士",type:"剣士",desc:"ひたすら剣を振っている。",sp:2},

  {name:"農家",type:"非戦闘職",desc:"作物を育てる職業。",sp:4},
  {name:"採集家",type:"非戦闘職",desc:"野外で素材を集める。",sp:4},
  {name:"木こり",type:"非戦闘職",desc:"木材を集める。",sp:4},
  {name:"鉱夫",type:"非戦闘職",desc:"鉱石を掘る。",sp:4},
  {name:"釣り師",type:"非戦闘職",desc:"魚を釣る。",sp:4},

  {name:"料理人",type:"非戦闘職",desc:"料理を作る。",sp:4},
  {name:"商人",type:"非戦闘職",desc:"売買を得意とする。",sp:4},
  {name:"鍛冶見習い",type:"非戦闘職",desc:"武器や防具を作る。",sp:4},
  {name:"地図描き",type:"非戦闘職",desc:"世界を探索して地図を作る。",sp:4},
  {name:"村人",type:"非戦闘職",desc:"普通の村人。可能性は未知数。",sp:5}
];

const skillTrees = {
  "剣士":[
    ["剣術","強撃","連撃","会心斬り"],
    ["受け流し","防御姿勢","反撃","鉄壁"],
    ["身軽","疾走","高速斬撃","瞬歩"]
  ],
  "騎士":[
    ["盾術","シールドバッシュ","守護","大盾"],
    ["防御訓練","鉄壁","守護陣","不屈"],
    ["槍術","突進","貫通突き","騎士突撃"]
  ],
  "魔法使い":[
    ["魔力操作","火球","大火球","爆炎"],
    ["水魔法","氷結","氷槍","絶対零度"],
    ["魔力回復","魔力増幅","詠唱短縮","大魔法"]
  ],
  "非戦闘職":[
    ["採集術","素材発見","希少素材発見","宝探し"],
    ["生活術","料理強化","制作強化","職人の心得"],
    ["商才","値引き","高値売却","大商人"]
  ]
};

/* =========================================================
   プレイヤーデータ
========================================================= */

let player = {
  name:"冒険者",
  race:"人間",
  job:"見習い騎士",

  level:1,
  exp:0,
  expNext:100,
  sp:0,
  gold:100,

  maxHP:100,
  hp:100,
  maxMP:30,
  mp:30,

  str:10,
  def:10,
  int:10,
  mnd:10,
  agi:10,

  learned:[]
};

let selectedRace = "人間";
let selectedJob = "見習い騎士";

/* =========================================================
   ホーム・キャラ作成
========================================================= */

function openCreation(){

  document.getElementById("home").style.display="none";
  document.getElementById("creation").style.display="block";

  renderRaces();
  renderJobs();
}

function backHome(){

  document.getElementById("creation").style.display="none";
  document.getElementById("home").style.display="flex";
}

function renderRaces(){

  const box=document.getElementById("raceCards");
  box.innerHTML="";

  races.forEach(r=>{

    const card=document.createElement("button");

    card.className="selectCard"+
      (r.name===selectedRace ? " selected":"");

    card.innerHTML=`
      <div class="cardName">${r.name}</div>
      <div class="cardDesc">${r.desc}</div>
      <div class="stat">特徴：${r.bonus}</div>
    `;

    card.onclick=()=>{

      selectedRace=r.name;
      renderRaces();

    };

    box.appendChild(card);

  });
}

function renderJobs(){

  const box=document.getElementById("jobCards");
  box.innerHTML="";

  jobs.forEach(j=>{

    const card=document.createElement("button");

    card.className="selectCard"+
      (j.name===selectedJob ? " selected":"");

    card.innerHTML=`
      <div class="cardName">${j.name}</div>
      <div class="cardDesc">${j.desc}</div>
      <div class="stat">${j.type} / SP獲得 ${j.sp}</div>
    `;

    card.onclick=()=>{

      selectedJob=j.name;
      renderJobs();

    };

    box.appendChild(card);

  });
}

};

function init3D(){

  if(scene) return;

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x86b6e8);

  scene.fog=new THREE.Fog(0x86b6e8,45,180);

  camera=new THREE.PerspectiveCamera(
    60,
    innerWidth/innerHeight,
    .1,
    300
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  document.getElementById("game")
    .appendChild(renderer.domElement);

  /* 光 */

  const hemi=new THREE.HemisphereLight(
    0xffffff,
    0x506040,
    1.8
  );

  scene.add(hemi);

  const sun=new THREE.DirectionalLight(
    0xffffff,
    2
  );

  sun.position.set(30,50,20);

  scene.add(sun);

  /* 地面 */

  const groundGeo=
    new THREE.PlaneGeometry(240,240);

  const groundMat=
    new THREE.MeshStandardMaterial({
      color:0x4e8749
    });

  const ground=
    new THREE.Mesh(
      groundGeo,
      groundMat
    );

  ground.rotation.x=-Math.PI/2;

  scene.add(ground);

  /* 道 */

  const roadMat=
    new THREE.MeshStandardMaterial({
      color:0x92795a
    });

  const road=
    new THREE.Mesh(
      new THREE.BoxGeometry(20,.08,240),
      roadMat
    );

  road.position.y=.04;

  scene.add(road);

  const road2=
    new THREE.Mesh(
      new THREE.BoxGeometry(240,.08,20),
      roadMat
    );

  road2.position.y=.045;

  scene.add(road2);

  /* 街 */

  createTown();

  /* 木 */

  for(let i=0;i<70;i++){

    const x=(Math.random()-.5)*200;
    const z=(Math.random()-.5)*200;

    if(Math.abs(x)<18 || Math.abs(z)<18)
      continue;

    createTree(x,z);
  }

  /* プレイヤー */

  createPlayer();

  /* モンスター */

  createMonster("スライム",18,3,-15,30);
  createMonster("ゴブリン",-15,3,-25,50);
  createMonster("ウルフ",25,3,-35,70);
  createMonster("スライム",-28,3,-40,30);

  /* カメラ */

  camera.position.set(
    0,7,10
  );

  controls=new THREE.OrbitControls(
    camera,
    renderer.domElement
  );

  controls.enablePan=false;
  controls.enableZoom=false;
  controls.enableDamping=true;

  controls.target.set(0,1,0);

  setupControls();

  animate();
}

/* =========================================================
   EXP / LEVEL
========================================================= */

function gainExp(amount){

  player.exp+=amount;

  while(player.exp>=player.expNext){

    player.exp-=player.expNext;

    player.level++;

    player.expNext=
      Math.floor(player.expNext*1.25);

    const job=
      jobs.find(j=>j.name===player.job);

    const gain=
      job ? job.sp : 2;

    player.sp+=gain;

    player.maxHP+=10;
    player.maxMP+=4;

    player.hp=player.maxHP;
    player.mp=player.maxMP;

    player.str+=2;
    player.def+=2;
    player.int+=2;
    player.mnd+=2;
    player.agi+=2;

    showMessage(
      `レベルアップ！ Lv.${player.level} / SP +${gain}`
    );
  }

  updateHUD();
}

/* =========================================================
   攻撃
========================================================= */

function attackNearest(){

  if(!playerObject) return;

  let target=null;
  let dist=999;

  monsters.forEach(m=>{

    if(m.userData.hp<=0)
      return;

    const d=
      playerObject.position.distanceTo(
        m.position
      );

    if(d<dist){

      dist=d;
      target=m;

    }

  });

  if(!target){

    showMessage("近くに敵がいない。");
    return;
  }

  if(dist>5){

    showMessage("敵に近づいてください。");
    return;
  }

  const damage=
    Math.floor(
      player.str*1.8
    );

  target.userData.hp-=damage;

  showMessage(
    `${target.userData.name}に${damage}ダメージ！`
  );

  if(target.userData.hp<=0){

    showMessage(
      `${target.userData.name}を倒した！`
    );

    gainExp(
      target.userData.maxHP
    );

    player.gold+=
      target.userData.maxHP;

    target.visible=false;

  }

  updateHUD();
}

   ジャンプ・ダッシュ
========================================================= */

let jumpPower=0;

function jump(){

  if(playerObject){
    jumpPower=0.22;
  }
}

function dash(){

  if(!playerObject)
    return;

  const dir=
    new THREE.Vector3();

  camera.getWorldDirection(dir);

  dir.y=0;

  dir.normalize();

  playerObject.position.add(
    dir.multiplyScalar(3)
  );
}

/* =========================================================
   キーボード
========================================================= */

function setupControls(){

  addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key===" "){
      jump();
    }

    if(e.key.toLowerCase()==="e"){
      attackNearest();
    }

    if(e.key.toLowerCase()==="m"){
      openMenu();
    }

  });

  addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
  });

  /* iPadジョイスティック */

  const joy=
    document.getElementById("joystick");

  const knob=
    document.getElementById("knob");

  let active=false;

  joy.addEventListener("pointerdown",e=>{
    active=true;
    joy.setPointerCapture(e.pointerId);
  });

  joy.addEventListener("pointermove",e=>{

    if(!active)return;

    const rect=
      joy.getBoundingClientRect();

    let x=
      e.clientX-
      (rect.left+rect.width/2);

    let y=
      e.clientY-
      (rect.top+rect.height/2);

    const max=38;

    const len=Math.hypot(x,y);

    if(len>max){

      x=x/len*max;
      y=y/len*max;

    }

    knob.style.transform=
      `translate(${x}px,${y}px)`;

    joystick.x=x/max;
    joystick.y=y/max;

  });

  const resetJoy=()=>{

    active=false;

    joystick.x=0;
    joystick.y=0;

    knob.style.transform=
      "translate(0,0)";
  };

  joy.addEventListener(
    "pointerup",
    resetJoy
  );

  joy.addEventListener(
    "pointercancel",
    resetJoy
  );

  /* カメラスワイプ */

  const area=
    document.getElementById("cameraArea");

  let lastX=0;
  let lastY=0;
  let cameraDrag=false;

  area.addEventListener("pointerdown",e=>{

    cameraDrag=true;
    lastX=e.clientX;
    lastY=e.clientY;

  });

  area.addEventListener("pointermove",e=>{

    if(!cameraDrag)return;

    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;

    lastX=e.clientX;
    lastY=e.clientY;

    if(controls){

      controls.rotateLeft(dx*.005);
      controls.rotateUp(dy*.005);

    }

  });

  area.addEventListener(
    "pointerup",
    ()=>cameraDrag=false
  );

  area.addEventListener(
    "pointercancel",
    ()=>cameraDrag=false
  );
}

/* =========================================================
   移動
========================================================= */

function updateMovement(){

  if(!playerObject)
    return;

  let x=0;
  let z=0;

  if(keys["w"]) z-=1;
  if(keys["s"]) z+=1;
  if(keys["a"]) x-=1;
  if(keys["d"]) x+=1;

  x+=joystick.x;
  z+=joystick.y;

  const length=
    Math.hypot(x,z);

  if(length>1){

    x/=length;
    z/=length;

  }

  const speed=
    keys["shift"]
      ? .22
      : .11;

  playerObject.position.x+=
    x*speed;

  playerObject.position.z+=
    z*speed;

  /* ジャンプ */

  if(jumpPower>0){

    playerObject.position.y+=
      jumpPower;

    jumpPower-=.012;

  }

  if(playerObject.position.y<0){

    playerObject.position.y=0;
    jumpPower=0;

  }

  /* カメラ追従 */

  if(controls){

    controls.target.lerp(
      new THREE.Vector3(
        playerObject.position.x,
        1.5,
        playerObject.position.z
      ),
      .12
    );

  }
}

/* =========================================================
   戦闘
========================================================= */

let currentEnemy=null;

function startBattle(enemy){

  currentEnemy=enemy;

  document.getElementById("battleUI")
    .style.display="block";

  document.getElementById("enemyName")
    .textContent=enemy.userData.name;

  updateBattle();

  document.getElementById("battleLog")
    .innerHTML=
    `<div>${enemy.userData.name}が現れた！</div>`;
}

function updateBattle(){

  if(!currentEnemy)return;

  const hp=
    Math.max(
      0,
      currentEnemy.userData.hp
    );

  const max=
    currentEnemy.userData.maxHP;

  document.getElementById("enemyHP")
    .style.width=
    `${hp/max*100}%`;

  document.getElementById("enemyStatus")
    .textContent=
    `HP ${hp} / ${max}`;
}

function battleLog(text){

  const log=
    document.getElementById("battleLog");

  log.innerHTML+=
    `<div>${text}</div>`;

  log.scrollTop=log.scrollHeight;
}

function battleAttack(){

  if(!currentEnemy)return;

  const damage=
    Math.floor(player.str*1.5);

  currentEnemy.userData.hp-=damage;

  battleLog(
    `${player.name}の攻撃！ ${damage}ダメージ！`
  );

  updateBattle();

  if(currentEnemy.userData.hp<=0){

    battleLog(
      `${currentEnemy.userData.name}を倒した！`
    );

    gainExp(
      currentEnemy.userData.maxHP
    );

    player.gold+=
      currentEnemy.userData.maxHP;

    currentEnemy.visible=false;

    setTimeout(endBattle,600);

  }else{

    enemyAttackTurn();

  }
}

function battleSkill(){

  if(player.sp<5){

    battleLog("SPが足りない！");
    return;
  }

  player.sp-=5;

  const damage=
    Math.floor(
      player.int*2.5+
      player.str
    );

  currentEnemy.userData.hp-=damage;

  battleLog(
    `スキル発動！ ${damage}ダメージ！`
  );

  updateBattle();
  updateHUD();

  if(currentEnemy.userData.hp<=0){

    battleLog("敵を倒した！");

    gainExp(
      currentEnemy.userData.maxHP*2
    );

    player.gold+=
      currentEnemy.userData.maxHP*2;

    currentEnemy.visible=false;

    setTimeout(endBattle,600);

  }else{

    enemyAttackTurn();

  }
}

function battleGuard(){

  battleLog(
    `${player.name}は身を守っている！`
  );

  enemyAttackTurn(true);
}

function battleEscape(){

  if(Math.random()<.7){

    battleLog("うまく逃げ切った！");

    setTimeout(endBattle,500);

  }else{

    battleLog("逃げられない！");
    enemyAttackTurn();

  }
}

function enemyAttackTurn(guard=false){

  let damage=
    Math.max(
      1,
      Math.floor(
        currentEnemy.userData.maxHP*.18
      )
    );

  if(guard)
    damage=Math.floor(damage*.5);

  player.hp=
    Math.max(
      0,
      player.hp-damage
    );

  battleLog(
    `${currentEnemy.userData.name}の攻撃！ ${damage}ダメージ！`
  );

  updateHUD();

  if(player.hp<=0){

    battleLog("力尽きた……");

    setTimeout(()=>{
      player.hp=player.maxHP;
      endBattle();
      showMessage("街に戻された。");
      playerObject.position.set(0,0,12);
    },1000);
  }
}

function endBattle(){

  document.getElementById("battleUI")
    .style.display="none";

  currentEnemy=null;

  updateHUD();
}

/* =========================================================
   自動エンカウント
========================================================= */

let encounterTimer=0;

function checkEncounter(delta){

  encounterTimer+=delta;

  if(encounterTimer<5)
    return;

  encounterTimer=0;

  if(!playerObject)
    return;

  /* 街の外 */

  if(
    Math.abs(playerObject.position.x)>15 ||
    playerObject.position.z<-18
  ){

    if(Math.random()<.05){

      const alive=
        monsters.filter(
          m=>m.visible
        );

      if(alive.length){

        const enemy=
          alive[
            Math.floor(
              Math.random()*alive.length
            )
          ];

        const dist=
          playerObject.position
            .distanceTo(enemy.position);

        if(dist<12){

          startBattle(enemy);

        }

      }

    }

  }
}

/* =========================================================
   メインループ
========================================================= */

let lastTime=performance.now();

function animate(){

  requestAnimationFrame(animate);

  const now=performance.now();

  const delta=
    (now-lastTime)/1000;

  lastTime=now;

  updateMovement();

  checkEncounter(delta);

  /* モンスターをプレイヤー方向へ */

  monsters.forEach(m=>{

    if(!m.visible)return;

    const dist=
      m.position.distanceTo(
        playerObject.position
      );

    if(dist<12 && dist>3){

      const dir=
        new THREE.Vector3()
          .subVectors(
            playerObject.position,
            m.position
          )
          .normalize();

      m.position.x+=dir.x*.01;
      m.position.z+=dir.z*.01;

    }

  });

  controls.update();

  renderer.render(
    scene,
    camera
  );
}

/* =========================================================
   リサイズ
========================================================= */

addEventListener("resize",()=>{

  if(!camera || !renderer)
    return;

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

});

</script>

</body>
</html>
