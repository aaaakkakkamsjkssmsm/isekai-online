<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>異世界オンライン 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:system-ui,sans-serif;
  touch-action:none;
}
#game{
  position:fixed;
  inset:0;
}
#hud{
  position:fixed;
  left:15px;
  top:15px;
  z-index:10;
  color:white;
  background:rgba(5,12,25,.82);
  border:1px solid rgba(255,255,255,.25);
  border-radius:14px;
  padding:13px 16px;
  min-width:255px;
  backdrop-filter:blur(8px);
}
.title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:5px;
}
.bar{
  width:220px;
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin:3px 0 7px;
}
.fill{
  height:100%;
  background:#42d879;
}
.mpFill{
  background:#4388ff;
}
#help{
  position:fixed;
  left:15px;
  bottom:15px;
  z-index:10;
  color:white;
  background:rgba(0,0,0,.65);
  border-radius:10px;
  padding:10px 13px;
  font-size:13px;
}
#cross{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:white;
  z-index:5;
  font-size:23px;
  text-shadow:0 0 5px black;
}
#message{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  z-index:20;
  color:white;
  background:rgba(0,0,0,.8);
  border-radius:12px;
  padding:11px 20px;
  display:none;
}
#menu{
  position:fixed;
  right:15px;
  top:15px;
  z-index:30;
  width:330px;
  max-height:85vh;
  overflow:auto;
  color:white;
  background:rgba(7,14,28,.95);
  border:1px solid rgba(255,255,255,.25);
  border-radius:15px;
  padding:15px;
  display:none;
}
.skill{
  background:rgba(255,255,255,.08);
  border-radius:8px;
  padding:8px;
  margin:5px 0;
}
.locked{
  opacity:.45;
}
button{
  color:white;
  background:#294c7c;
  border:0;
  border-radius:8px;
  padding:8px 11px;
  font-weight:bold;
}
button:active{
  transform:scale(.95);
}

/* iPad */
#touchUI{
  display:none;
  position:fixed;
  inset:0;
  z-index:15;
  pointer-events:none;
}
#joystick{
  position:absolute;
  left:25px;
  bottom:30px;
  width:145px;
  height:145px;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  border:2px solid rgba(255,255,255,.35);
  pointer-events:auto;
}
#knob{
  position:absolute;
  left:43px;
  top:43px;
  width:55px;
  height:55px;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  border:2px solid white;
}
#cameraArea{
  position:absolute;
  right:0;
  top:0;
  width:55%;
  height:72%;
  pointer-events:auto;
}
#actions{
  position:absolute;
  right:18px;
  bottom:20px;
  display:grid;
  grid-template-columns:75px 75px;
  gap:9px;
  pointer-events:auto;
}
.touchButton{
  width:75px;
  height:65px;
  border-radius:18px;
  background:rgba(15,35,65,.88);
  border:1px solid rgba(255,255,255,.3);
  color:white;
  font-size:13px;
}
@media(pointer:coarse){
  #touchUI{
    display:block;
  }
  #help{
    display:none;
  }
}
</style>
</head>

<body>

<div id="game"></div>
<div id="cross">+</div>

<div id="hud">
  <div class="title">⚔️ 異世界オンライン</div>
  <div>
    <span id="job">二刀流見習い</span>
    /
    <span id="race">オーク</span>
  </div>

  <div>
    Lv.<span id="level">1</span>
   　
    EXP <span id="exp">0</span>/100
  </div>

  <div>
    HP <span id="hp">55</span>/<span id="maxHp">55</span>
  </div>
  <div class="bar">
    <div id="hpBar" class="fill" style="width:100%"></div>
  </div>

  <div>
    MP <span id="mp">20</span>/<span id="maxMp">20</span>
  </div>
  <div class="bar">
    <div id="mpBar" class="fill mpFill" style="width:100%"></div>
  </div>

  <div>
    SP <span id="sp">0</span>
   　
    💰 <span id="gold">100</span>
  </div>
</div>

<div id="help">
  WASD：移動　Shift：ダッシュ　Space：ジャンプ　E：攻撃　M：メニュー
</div>

<div id="message"></div>
<div id="menu"></div>

<!-- iPad操作 -->
<div id="touchUI">

  <div id="joystick">
    <div id="knob"></div>
  </div>

  <div id="cameraArea"></div>

  <div id="actions">

    <button class="touchButton" id="attackButton">
      ⚔️<br>攻撃
    </button>

    <button class="touchButton" id="jumpButton">
      🦘<br>ジャンプ
    </button>

    <button class="touchButton" id="dashButton">
      🏃<br>ダッシュ
    </button>

    <button class="touchButton" id="skillButton">
      ✨<br>スキル
    </button>

    <button class="touchButton" id="menuButton">
      🎒<br>メニュー
    </button>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>

/* =========================================================
   3D WORLD
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x88bce5);

scene.fog = new THREE.Fog(
  0x88bce5,
  45,
  180
);

const camera = new THREE.PerspectiveCamera(
  60,
  innerWidth / innerHeight,
  0.1,
  500
);

camera.position.set(
  0,
  5,
  10
);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* LIGHT */

scene.add(
  new THREE.HemisphereLight(
    0xeaf4ff,
    0x405238,
    2
  )
);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    2.4
  );

sun.position.set(
  -40,
  60,
  30
);

sun.castShadow = true;

scene.add(sun);


/* MATERIAL */

function material(color){
  return new THREE.MeshStandardMaterial({
    color:color
  });
}


/* GROUND */

const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      220,
      220
    ),
    material(0x4c884a)
  );

ground.rotation.x =
  -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* BOX */

function createBox(
  x,
  y,
  z,
  sx,
  sy,
  sz,
  color
){

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        sx,
        sy,
        sz
      ),
      material(color)
    );

  mesh.position.set(
    x,
    y,
    z
  );

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);

  return mesh;
}


/* =========================================================
   TOWN
========================================================= */

/* 道路 */

createBox(
  0,
  .03,
  0,
  18,
  .1,
  220,
  0xb49b70
);

createBox(
  0,
  .04,
  0,
  220,
  .1,
  18,
  0xb49b70
);


/* 城壁 */

createBox(
  -32,
  3,
  0,
  2,
  6,
  64,
  0x777777
);

createBox(
  32,
  3,
  0,
  2,
  6,
  64,
  0x777777
);

createBox(
  0,
  3,
  -32,
  64,
  6,
  2,
  0x777777
);


/* 建物 */

function createBuilding(
  x,
  z,
  color
){

  createBox(
    x,
    3,
    z,
    10,
    6,
    8,
    color
  );

  const roof =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        7,
        4,
        4
      ),
      material(0x633b2a)
    );

  roof.position.set(
    x,
    8,
    z
  );

  roof.rotation.y =
    Math.PI / 4;

  roof.castShadow = true;

  scene.add(roof);
}

createBuilding(
  -17,
  -12,
  0x9a6848
);

createBuilding(
  17,
  -12,
  0x5b6e9b
);

createBuilding(
  0,
  -20,
  0x8c5c7c
);

createBuilding(
  -17,
  12,
  0x7c7c62
);

createBuilding(
  17,
  12,
  0x6d8d6d
);


/* 街の門 */

createBox(
  0,
  3,
  -31,
  10,
  6,
  2,
  0x8a6b45
);


/* =========================================================
   TREES
========================================================= */

function createTree(x,z){

  createBox(
    x,
    2,
    z,
    1.2,
    4,
    1.2,
    0x754b2c
  );

  const crown =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        3.2,
        7,
        8
      ),
      material(0x236b35)
    );

  crown.position.set(
    x,
    7,
    z
  );

  crown.castShadow = true;

  scene.add(crown);
}


for(
  let x=-90;
  x<=90;
  x+=15
){

  for(
    let z=-90;
    z<=90;
    z+=18
  ){

    if(Math.random() < .55){

      createTree(
        x + Math.random()*7-3.5,
        z + Math.random()*7-3.5
      );

    }

  }

}


/* =========================================================
   PLAYER
========================================================= */

const player =
  new THREE.Group();

player.position.set(
  0,
  0,
  10
);

scene.add(player);


/* BODY */

const body =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .65,
      1.3,
      6,
      12
    ),
    material(0x315b9c)
  );

body.position.y =
  1.25;

body.castShadow = true;

player.add(body);


/* HEAD */

const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .52,
      16,
      16
    ),
    material(0x9b6b4c)
  );

head.position.y =
  2.45;

head.castShadow = true;

player.add(head);


/* SWORD */

const sword =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .12,
      1.5,
      .12
    ),
    new THREE.MeshStandardMaterial({
      color:0xdde5ee,
      metalness:.8
    })
  );

sword.position.set(
  .85,
  1.35,
  0
);

sword.rotation.z =
  -.35;

sword.castShadow = true;

player.add(sword);


/* =========================================================
   MONSTERS
========================================================= */

const monsters = [];

function createMonster(x,z){

  const group =
    new THREE.Group();

  group.position.set(
    x,
    0,
    z
  );

  const body =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1.15,
        16,
        12
      ),
      material(0x4c9c65)
    );

  body.scale.y = .8;

  body.position.y =
    1.05;

  body.castShadow = true;

  group.add(body);

  /* 目 */

  const eyeMaterial =
    new THREE.MeshBasicMaterial({
      color:0xffffff
    });

  for(
    const xOffset of [-.38,.38]
  ){

    const eye =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .16,
          8,
          8
        ),
        eyeMaterial
      );

    eye.position.set(
      xOffset,
      1.35,
      .95
    );

    group.add(eye);

  }

  scene.add(group);

  monsters.push({
    object:group,
    hp:35,
    alive:true
  });
}


/* フィールドの敵 */

createMonster(
  10,
  -42
);

createMonster(
  -13,
  -55
);

createMonster(
  22,
  -65
);


/* =========================================================
   PLAYER DATA
========================================================= */

const state = {

  level:1,

  exp:0,

  sp:0,

  gold:100,

  hp:55,
  maxHp:55,

  mp:20,
  maxMp:20,

  job:"二刀流見習い",

  race:"オーク",

  str:10,
  def:7,
  agi:9

};


/* =========================================================
   JOB / SKILL TREES
========================================================= */

const jobs = {

  "二刀流見習い":{

    skillPointGain:2,

    trees:[

      {
        name:"双剣技",

        skills:[
          "二連斬り",
          "追撃",
          "双剣強化",
          "乱舞"
        ]

      },

      {
        name:"身軽さ",

        skills:[
          "身軽",
          "回避上昇",
          "疾走",
          "幻影歩法"
        ]

      },

      {
        name:"戦術",

        skills:[
          "急所狙い",
          "反撃",
          "闘志",
          "双刃奥義"
        ]

      }

    ]

  },


  "見習い騎士":{

    skillPointGain:1,

    trees:[

      {
        name:"盾術",

        skills:[
          "盾防御",
          "防御姿勢",
          "守護",
          "鉄壁"
        ]

      },

      {
        name:"剣技",

        skills:[
          "斬撃",
          "強撃",
          "連撃",
          "騎士の一撃"
        ]

      },

      {
        name:"守護",

        skills:[
          "挑発",
          "庇う",
          "生命力",
          "守護騎士"
        ]

      }

    ]

  },


  "魔法見習い":{

    skillPointGain:3,

    trees:[

      {
        name:"火魔法",

        skills:[
          "火種",
          "火球",
          "火柱",
          "爆炎"
        ]

      },

      {
        name:"水魔法",

        skills:[
          "水滴",
          "水弾",
          "氷槍",
          "大海嘯"
        ]

      },

      {
        name:"魔力",

        skills:[
          "魔力増加",
          "詠唱短縮",
          "魔力回復",
          "賢者の卵"
        ]

      }

    ]

  }

};


const learnedSkills =
  new Set();


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  document.getElementById(
    "level"
  ).textContent =
    state.level;

  document.getElementById(
    "exp"
  ).textContent =
    state.exp;

  document.getElementById(
    "sp"
  ).textContent =
    state.sp;

  document.getElementById(
    "gold"
  ).textContent =
    state.gold;

  document.getElementById(
    "hp"
  ).textContent =
    state.hp;

  document.getElementById(
    "maxHp"
  ).textContent =
    state.maxHp;

  document.getElementById(
    "mp"
  ).textContent =
    state.mp;

  document.getElementById(
    "maxMp"
  ).textContent =
    state.maxMp;

  document.getElementById(
    "job"
  ).textContent =
    state.job;

  document.getElementById(
    "race"
  ).textContent =
    state.race;

  document.getElementById(
    "hpBar"
  ).style.width =
    (state.hp/state.maxHp*100)+"%";

  document.getElementById(
    "mpBar"
  ).style.width =
    (state.mp/state.maxMp*100)+"%";
}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;

function showMessage(text){

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.style.display =
    "block";

  clearTimeout(
    messageTimer
  );

  messageTimer =
    setTimeout(
      ()=>{
        box.style.display =
          "none";
      },
      1700
    );

}


/* =========================================================
   SKILL MENU
========================================================= */

function openMenu(){

  const menu =
    document.getElementById(
      "menu"
    );

  if(
    menu.style.display === "block"
  ){

    menu.style.display =
      "none";

    return;

  }


  const job =
    jobs[state.job];

  let html = `

    <h2>🎒 キャラクター</h2>

    <p>
      Lv.${state.level}
     　
      ${state.race}
      /
      ${state.job}
    </p>

    <p>
      STR ${state.str}
     　
      DEF ${state.def}
     　
      AGI ${state.agi}
    </p>

    <p>
      スキルポイント：
      <b>${state.sp}</b>
    </p>

    <hr>

    <h2>🌳 スキルツリー</h2>

  `;


  job.trees.forEach(
    (tree,treeIndex)=>{

      html +=
        `<h3>${tree.name}</h3>`;

      tree.skills.forEach(
        (skill,index)=>{

          const id =
            treeIndex+"-"+index;

          const cost =
            5 + index*2;

          const learned =
            learnedSkills.has(id);

          html += `

            <div class="skill
              ${learned ? "" : "locked"}">

              ${learned ? "✅" : "🔒"}

              ${skill}

              <small>
                (${cost}SP)
              </small>

              ${
                !learned &&
                state.sp >= cost

                ?

                `<button
                  onclick="learnSkill('${id}','${skill}',${cost})">
                  習得
                </button>`

                :

                ""
              }

            </div>

          `;

        }
      );

    }
  );


  html += `

    <hr>

    <h3>⚔️ 装備</h3>

    <p>
      武器：初心者の双剣<br>
      防具：布の服<br>
      装飾：旅人のお守り
    </p>

    <button onclick="openMenu()">
      閉じる
    </button>

  `;


  menu.innerHTML =
    html;

  menu.style.display =
    "block";

}


/* =========================================================
   LEARN SKILL
========================================================= */

window.learnSkill =
function(
  id,
  skill,
  cost
){

  if(
    state.sp >= cost &&
    !learnedSkills.has(id)
  ){

    state.sp -= cost;

    learnedSkills.add(id);

    updateHUD();

    showMessage(
      "✨ "+skill+"を習得！"
    );

    openMenu();

    openMenu();

  }

};


/* =========================================================
   EXP / LEVEL
========================================================= */

function gainExp(amount){

  state.exp += amount;


  while(
    state.exp >= 100
  ){

    state.exp -= 100;

    state.level++;


    const gain =
      jobs[state.job]
        .skillPointGain;


    state.sp += gain;

    state.maxHp += 7;

    state.hp =
      state.maxHp;

    state.maxMp += 3;

    state.mp =
      state.maxMp;

    state.str += 2;

    state.def += 1;

    state.agi += 1;


    showMessage(
      "🎉 レベルアップ！  +" +
      gain +
      " SP"
    );

  }


  updateHUD();

}


/* =========================================================
   ATTACK
========================================================= */

function attack(){

  let target =
    null;

  let closest =
    Infinity;


  for(
    const monster of monsters
  ){

    if(
      !monster.alive
    )
      continue;


    const distance =
      player.position.distanceTo(
        monster.object.position
      );


    if(
      distance < closest
    ){

      closest =
        distance;

      target =
        monster;

    }

  }


  if(
    target &&
    closest < 4
  ){

    target.hp -= 18;

    showMessage(
      "⚔️ 攻撃！"
    );


    if(
      target.hp <= 0
    ){

      target.alive =
        false;

      scene.remove(
        target.object
      );

      state.gold += 20;

      gainExp(35);

      showMessage(
        "✨ モンスター撃破！ +35EXP"
      );

    }

  }

}


/* =========================================================
   KEYBOARD
========================================================= */

const keys = {};

let velocityY = 0;

let grounded = true;


window.addEventListener(
  "keydown",
  event=>{

    keys[event.code] =
      true;


    if(
      event.code === "Space" &&
      grounded
    ){

      velocityY =
        8;

      grounded =
        false;

    }


    if(
      event.code === "KeyE"
    ){

      attack();

    }


    if(
      event.code === "KeyM"
    ){

      openMenu();

    }

  }
);


window.addEventListener(
  "keyup",
  event=>{

    keys[event.code] =
      false;

  }
);


/* =========================================================
   TOUCH JOYSTICK
========================================================= */

const joystick =
  document.getElementById(
    "joystick"
  );

const knob =
  document.getElementById(
    "knob"
  );

const touchMovement = {
  x:0,
  z:0
};

let joystickPointer =
  null;


function updateJoystick(
  x,
  y
){

  const rect =
    joystick.getBoundingClientRect();

  const centerX =
    rect.left +
    rect.width/2;

  const centerY =
    rect.top +
    rect.height/2;

  let dx =
    x-centerX;

  let dy =
    y-centerY;

  const max =
    45;

  const length =
    Math.hypot(dx,dy);


  if(
    length > max
  ){

    dx =
      dx/length*max;

    dy =
      dy/length*max;

  }


  knob.style.transform =
    `translate(${dx}px,${dy}px)`;


  touchMovement.x =
    dx/max;

  touchMovement.z =
    dy/max;

}


joystick.addEventListener(
  "pointerdown",
  event=>{

    joystickPointer =
      event.pointerId;

    joystick.setPointerCapture(
      event.pointerId
    );

    updateJoystick(
      event.clientX,
      event.clientY
    );

  }
);


joystick.addEventListener(
  "pointermove",
  event=>{

    if(
      event.pointerId !==
      joystickPointer
    )
      return;

    updateJoystick(
      event.clientX,
      event.clientY
    );

  }
);


function resetJoystick(){

  joystickPointer =
    null;

  knob.style.transform =
    "translate(0,0)";

  touchMovement.x =
    0;

  touchMovement.z =
    0;

}


joystick.addEventListener(
  "pointerup",
  resetJoystick
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


/* =========================================================
   TOUCH CAMERA
========================================================= */

const cameraArea =
  document.getElementById(
    "cameraArea"
  );

let cameraPointer =
  null;

let previousCameraX =
  0;

let previousCameraY =
  0;


cameraArea.addEventListener(
  "pointerdown",
  event=>{

    cameraPointer =
      event.pointerId;

    previousCameraX =
      event.clientX;

    previousCameraY =
      event.clientY;

    cameraArea.setPointerCapture(
      event.pointerId
    );

  }
);


cameraArea.addEventListener(
  "pointermove",
  event=>{

    if(
      event.pointerId !==
      cameraPointer
    )
      return;


    const dx =
      event.clientX -
      previousCameraX;

    const dy =
      event.clientY -
      previousCameraY;


    previousCameraX =
      event.clientX;

    previousCameraY =
      event.clientY;


    player.rotation.y -=
      dx * .008;


    camera.position.x +=
      dx * .025;

    camera.position.y -=
      dy * .015;

  }
);


cameraArea.addEventListener(
  "pointerup",
  ()=>{
    cameraPointer =
      null;
  }
);


/* =========================================================
   TOUCH BUTTONS
========================================================= */

function touchButton(
  id,
  callback
){

  document
    .getElementById(id)
    .addEventListener(
      "pointerdown",
      event=>{

        event.preventDefault();

        callback();

      }
    );

}


touchButton(
  "attackButton",
  attack
);


touchButton(
  "jumpButton",
  ()=>{

    if(grounded){

      velocityY =
        8;

      grounded =
        false;

    }

  }
);


touchButton(
  "dashButton",
  ()=>{

    keys.ShiftLeft =
      true;

    setTimeout(
      ()=>{
        keys.ShiftLeft =
          false;
      },
      500
    );

  }
);


touchButton(
  "skillButton",
  openMenu
);


touchButton(
  "menuButton",
  openMenu
);


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updateMovement(
  delta
){

  const direction =
    new THREE.Vector3();


  if(keys.KeyW)
    direction.z -= 1;

  if(keys.KeyS)
    direction.z += 1;

  if(keys.KeyA)
    direction.x -= 1;

  if(keys.KeyD)
    direction.x += 1;


  direction.x +=
    touchMovement.x;

  direction.z +=
    touchMovement.z;


  if(
    direction.length() > 0
  ){

    direction.normalize();


    const speed =
      (
        keys.ShiftLeft ||
        keys.ShiftRight
      )

      ?

      9

      :

      5;


    player.position.x +=
      direction.x *
      speed *
      delta;


    player.position.z +=
      direction.z *
      speed *
      delta;


    player.rotation.y =
      Math.atan2(
        direction.x,
        direction.z
      );

  }


  /* 重力 */

  velocityY -=
    20 * delta;


  player.position.y +=
    velocityY * delta;


  if(
    player.position.y <= 0
  ){

    player.position.y =
      0;

    velocityY =
      0;

    grounded =
      true;

  }


  /* ワールド境界 */

  player.position.x =
    Math.max(
      -105,
      Math.min(
        105,
        player.position.x
      )
    );

  player.position.z =
    Math.max(
      -105,
      Math.min(
        105,
        player.position.z
      )
    );

}


/* =========================================================
   THIRD PERSON CAMERA
========================================================= */

const controls =
  new THREE.OrbitControls(
    camera,
    renderer.domElement
  );

controls.enablePan =
  false;

controls.enableDamping =
  true;

controls.dampingFactor =
  .08;

controls.minDistance =
  4;

controls.maxDistance =
  12;


/* =========================================================
   GAME LOOP
========================================================= */

let previousTime =
  performance.now();


function gameLoop(
  currentTime
){

  const delta =
    Math.min(
      (currentTime -
       previousTime)
      / 1000,
      .05
    );

  previousTime =
    currentTime;


  updateMovement(
    delta
  );


  /* 三人称カメラ */

  const p =
    player.position;


  const desiredCamera =
    new THREE.Vector3(
      p.x,
      p.y + 4,
      p.z + 7
    );


  camera.position.lerp(
    desiredCamera,
    .12
  );


  const target =
    new THREE.Vector3(
      p.x,
      p.y + 1.2,
      p.z
    );


  controls.target.lerp(
    target,
    .15
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* START */

updateHUD();

requestAnimationFrame(
  gameLoop
);

</script>
